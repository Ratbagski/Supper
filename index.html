<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16281E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marquez Meals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16281E; --paper:#EBF0E4; --surface:#FFFFFF; --green:#2E5B3E;
    --citrus:#F0B429; --steel:#7E8A80; --hair:#D3DBCB; --chilli:#A63B2A; --tap:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
  .bar{position:sticky;top:0;z-index:20;background:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--hair)}
  .bar h1{font-size:25px;flex:1}
  .bar .sub{color:var(--steel);font-size:13px}
  .iconbtn{background:none;border:none;padding:8px;margin:-8px;color:var(--steel);min-width:var(--tap);min-height:var(--tap);display:grid;place-items:center;cursor:pointer}
  .iconbtn svg{width:21px;height:21px;display:block}
  .pane{padding:16px 18px 24px}
  .lede{color:var(--steel);font-size:14px;margin:0 0 14px}
  input[type=text],input[type=number],input[type=url],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:11px 12px;width:100%}
  textarea{resize:vertical;line-height:1.5}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,[role=button]:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
  .search{margin-bottom:12px}
  .chips{display:flex;gap:7px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:13.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--steel);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:13px 20px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);min-height:var(--tap)}
  .btn.primary{background:var(--citrus);border-color:var(--citrus)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.quiet{border-color:var(--hair);color:var(--steel);font-weight:500}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 14px;font-size:14px;min-height:40px}
  .btn.danger{border-color:var(--chilli);color:var(--chilli)}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .card{background:var(--surface);border:1px solid var(--hair);border-left:5px solid var(--hair);border-radius:3px;padding:13px 14px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start}
  .card.on{border-left-color:var(--citrus);background:#FFFDF4}
  .card .body{flex:1;min-width:0;cursor:pointer}
  .card h3{font-size:18.5px;line-height:1.25}
  .card .meta{font-size:13px;color:var(--steel);margin-top:3px}
  .tick{flex:0 0 auto;width:27px;height:27px;border-radius:3px;border:1.5px solid var(--steel);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;margin-top:2px}
  .tick[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
  .tick svg{width:16px;height:16px;color:var(--citrus);display:none}
  .tick[aria-pressed=true] svg{display:block}
  .thumb{flex:0 0 auto;width:58px;height:58px;border-radius:3px;object-fit:cover;background:var(--paper);display:block;border:1px solid var(--hair)}
  .thumb.ph{display:grid;place-items:center;color:var(--hair)}
  .thumb.ph svg{width:24px;height:24px}
  .hero{width:100%;max-height:230px;object-fit:cover;border-radius:3px;border:1px solid var(--hair);display:block;margin-bottom:14px}
  .pick-row{display:flex;gap:10px;align-items:center;margin-bottom:6px}
  .pick-row img{width:64px;height:64px;object-fit:cover;border-radius:3px;border:1px solid var(--hair)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--green);border:1px solid var(--hair)}
  .mult{display:flex;gap:6px;margin-top:9px;align-items:center;font-size:13px;color:var(--steel)}
  .mult button{font:inherit;font-size:13px;border:1px solid var(--hair);background:var(--surface);color:var(--steel);border-radius:999px;padding:4px 10px;cursor:pointer;min-height:32px}
  .mult button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
  .sect{margin:20px 0 8px;font-family:'Fraunces',serif;font-size:15px;color:var(--green);border-bottom:1px solid var(--hair);padding-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
  .sect span{font-family:'Archivo',sans-serif;font-size:12px;color:var(--steel);font-weight:400}
  .item{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted var(--hair)}
  .item .txt{flex:1}
  .item.done .txt{text-decoration:line-through;color:var(--steel)}
  .item .from{display:block;font-size:12px;color:var(--steel);margin-top:1px}
  .item input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:#2E5B3E;flex:0 0 auto}
  .amt{font-variant-numeric:tabular-nums;font-weight:600}
  .sticky-actions{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:10;background:linear-gradient(to top,var(--paper) 62%,rgba(235,240,228,0));padding:18px 0 4px;margin-top:8px}
  .logline{font-size:13px;color:var(--steel);margin-top:4px}
  .verdict{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--green)}
  .empty{border:1px dashed var(--hair);border-radius:3px;padding:26px 20px;text-align:center;background:var(--surface)}
  .empty h3{font-size:18px;margin-bottom:6px}
  .empty p{margin:0 0 14px;color:var(--steel);font-size:14px}
  .scrim{position:fixed;inset:0;background:rgba(22,40,30,.45);z-index:40;display:none}
  .scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;background:var(--paper);border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;padding:0 18px calc(26px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
  .sheet-bar{position:sticky;top:0;background:var(--paper);padding:16px 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair);margin-bottom:16px}
  .sheet-bar h2{font-size:21px;flex:1;line-height:1.2}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13.5px;color:var(--green);margin-bottom:5px;font-weight:500}
  .field .hint{font-size:12.5px;color:var(--steel);margin-top:5px}
  .ing-chip{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:8px 10px;margin-bottom:7px;font-size:14.5px}
  .ing-chip .txt{flex:1}
  .ing-chip select{width:auto;max-width:42%;padding:5px 7px;font-size:12.5px;border-radius:999px;background:var(--paper)}
  .steps{padding-left:22px;margin:0}
  .steps li{margin-bottom:9px}
  .ilist{list-style:none;padding:0;margin:0 0 18px}
  .ilist li{padding:7px 0;border-bottom:1px dotted var(--hair)}
  .picker{display:grid;gap:7px}
  .picker button{font:inherit;text-align:left;padding:13px 15px;border:1px solid var(--hair);background:var(--surface);border-radius:3px;cursor:pointer;color:var(--ink);min-height:var(--tap)}
  .picker button[aria-pressed=true]{border-color:var(--green);background:#FFFDF4;font-weight:600}
  a{color:var(--green)}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
  nav button{background:none;border:none;font:inherit;font-size:11.5px;color:var(--steel);padding:9px 0 7px;cursor:pointer;display:grid;justify-items:center;gap:3px;min-height:var(--tap)}
  nav button svg{width:23px;height:23px}
  nav button[aria-current=page]{color:var(--ink);font-weight:600}
  nav .badge{position:absolute;transform:translate(15px,-4px);background:var(--citrus);color:var(--ink);font-size:10.5px;font-weight:600;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}
  .toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:11px 17px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .notice{background:#FFFDF4;border:1px solid var(--citrus);border-radius:3px;padding:11px 13px;font-size:13.5px;margin-bottom:16px}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <h1 id="appTitle">Marquez Meals</h1>
    <span class="sub" id="barSub"></span>
    <button class="iconbtn" data-action="settings" aria-label="Settings, aisles and sync">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
    </button>
  </header>
  <main id="pane" class="pane"></main>
</div>

<nav>
  <button data-tab="recipes" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4.5h11a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M18 19.5h1.5"/><path d="M9 9h6M9 12.5h4"/></svg>
    Recipes
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6.5h3l2 11h9l2-8H7.5"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
    <span id="listBadgeWrap"></span>List
  </button>
  <button data-tab="archive">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7.5h16v3H4zM5.5 10.5v9h13v-9"/><path d="M10 14h4"/></svg>
    Made it
  </button>
  <button data-tab="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg>
    Add
  </button>
</nav>

<input type="file" id="photoInput" accept="image/*" style="position:fixed;left:-9999px;width:1px;height:1px" aria-hidden="true">
<div class="scrim" id="scrim" data-action="close-sheet"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =================================================================
   Supper Club — kitchen app for two.
   One file. Aisles ordered to match your supermarket walk.
   ================================================================= */

const KEY = 'supperclub-v2';
const SYNC_KEY = 'supperclub-sync';

/* Your store, in walking order. Editable in Settings. */
const DEFAULT_AISLES = ['Vegies','Fruits','Fresh pastry','Dairy','Eggs','Meats','Honey','Spreads',
  'Fresh pasta','Cereal','Breads','Long life milk','Drinks','Chocolates','Asian pantry','Mexican',
  'Italian','Yoghurts','Oils','Spices','Paper towels','Sugar','Desserts','Meds','Baby stuff',
  'Deodorant','Toothpaste','Cleaning stuff','Pet food','Frozen stuff','Other'];

/* First rule that matches wins, so order matters here. */
const RULES = [
  ['Fresh pastry',['puff pastry','filo','shortcrust','pastry sheet','pastry']],
  ['Frozen stuff',['frozen','ice cream','ice block','icy pole']],
  ['Vegies',['eggplant','aubergine']],
  ['Asian pantry',['coconut milk','coconut cream','soy sauce','fish sauce','oyster sauce','sesame oil','chilli oil','chili oil','rice vinegar','rice wine','sweet chilli','kecap','hoisin','water chestnut','shiitake','kimchi','gochugaru','gochujang','dried shiitake','curry roux','sinigang','matcha','sago','tamarind']],
  ['Eggs',['egg']],
  ['Honey',['honey']],
  ['Spreads',['peanut butter','almond butter','jam','marmalade','vegemite','nutella','tahini','hazelnut spread']],
  ['Yoghurts',['yoghurt','yogurt','greek yog']],
  ['Long life milk',['long life','uht','condensed milk','evaporated milk','almond milk','oat milk','soy milk']],
  ['Dairy',['milk','butter','cream','cheese','parmesan','feta','mozzarella','ricotta','halloumi','mascarpone','cheddar','creme fraiche','pesto','gruyere','american cheese','provolone','pecorino']],
  ['Fresh pasta',['fresh pasta','gnocchi','tortellini','ravioli','fresh lasagne']],
  ['Italian',['pasta','spaghetti','rigatoni','penne','risoni','orzo','lasagne','pappardelle','macaroni','fettucine','linguine','passata','tomato paste','crushed tomato','canned tomato','tinned tomato','balsamic','arborio','risotto rice','polenta','olives','caper','anchov','sun dried','pizza']],
  ['Mexican',['taco','tortilla','salsa','black bean','kidney bean','refried','jalapeno','jalapeño','chipotle','nacho','enchilada','burrito','corn chip','chickpea','baked bean','bean','tostada']],
  ['Asian pantry',['soy','noodle','miso','gochujang','sriracha','sesame','mirin','tofu','nori','wasabi','panko','dashi','sambal','curry paste','rice paper','rice','basmati','jasmine','five spice','shaoxing']],
  ['Spices',['cumin','paprika','cayenne','turmeric','cinnamon','oregano','chilli flakes','chili flakes','curry powder','garam','coriander seed','peppercorn','black pepper','white pepper','salt','stock','bay leaf','nutmeg','cardamom','garlic powder','onion powder','vanilla','dried herb','italian herb','star anise','cloves ground','taco seasoning','allspice']],
  ['Meats',['chicken','beef','pork','lamb','mince','bacon','sausage','chorizo','ham','salami','prosciutto','pancetta','turkey','steak','thigh','drumstick','maryland','salmon','prawn','shrimp','fish','tuna','squid','mussel','cod','snapper','barramundi','rasher','brisket','ribs','oyster','crab','pepperoni','lobster','scallop']],
  ['Oils',['olive oil','vegetable oil','canola','oil','vinegar','mayonnaise','mayo','mustard','ketchup','tomato sauce','hot sauce','worcestershire','pickle','gherkin','relish','dressing','barbecue sauce','bbq sauce','artichoke']],
  ['Sugar',['sugar','flour','baking powder','baking soda','bicarb','cornflour','cornstarch','yeast','icing','breadcrumb','desiccated coconut','golden syrup','maple syrup','gelatine','gelatin']],
  ['Chocolates',['chocolate','cocoa','choc chip','lolly','lollies']],
  ['Desserts',['custard','jelly','biscuit','wafer','meringue','cake mix','pavlova']],
  ['Cereal',['cereal','muesli','oats','porridge','weet','granola','cornflakes','chia']],
  ['Breads',['cob loaf','matzo','toast','bread','bun','baguette','sourdough','pita','naan','wrap','bagel','brioche','crumpet','english muffin','roll']],
  ['Fruits',['lemon','lime','apple','banana','orange','berries','strawberr','blueberr','raspberr','grape','pear','pineapple','mango','melon','peach','plum','kiwi','passionfruit','cherry','mandarin','nectarine','apricot']],
  ['Vegies',['onion','garlic','tomato','potato','carrot','celery','cucumber','chilli','chili','capsicum','spinach','coriander','cilantro','parsley','basil','mint','ginger','shallot','lettuce','avocado','mushroom','broccoli','zucchini','courgette','cabbage','leek','corn','peas','thyme','rosemary','dill','cauliflower','kale','beetroot','pumpkin','bean sprout','snow pea','asparagus','radish','fennel','rocket','silverbeet','chives','lemongrass','salad','herb','sprout','swede','turnip','parsnip']],
  ['Drinks',['juice','soft drink','cola','sparkling','cordial','tea','coffee','beer','wine','vodka','gin','sherry','soda water','water','kombucha','ice']],
  ['Paper towels',['paper towel','toilet paper','tissue','napkin','baking paper','foil','cling','glad wrap','bin bag','bin liner','zip lock']],
  ['Meds',['panadol','nurofen','paracetamol','ibuprofen','vitamin','band aid','band-aid','bandaid','lozenge','antiseptic','cough']],
  ['Baby stuff',['nappy','nappies','baby','wipes','formula','dummy']],
  ['Deodorant',['deodorant','antiperspirant','roll on']],
  ['Toothpaste',['toothpaste','toothbrush','floss','mouthwash']],
  ['Cleaning stuff',['detergent','dishwash','bleach','soap','shampoo','conditioner','sponge','cleaner','disinfectant','laundry','fabric softener','spray n wipe']],
  ['Pet food',['dog food','cat food','kibble','dog treat','pet']]
];

/* What's in it — used for the filter row. Guessed, then editable per recipe. */
const KINDS = ['Chicken','Beef','Pork','Lamb','Seafood','Vegetarian','Other'];
/* Labels live as tags, so a recipe can be Chicken AND cheap AND a side. */
const LABELS = [['quick','Quick'],['cheap','Cheap'],['side','Side'],['sauce','Sauce']];
const hasLabel=(r,tag)=>(r.tags||[]).some(t=>String(t).toLowerCase()===tag);
const KIND_WORDS = [
  ['Seafood',['salmon','prawn','shrimp','fish','tuna','squid','mussel','cod','snapper','barramundi','scallop','crab','lobster','octopus','anchov','sardine']],
  ['Chicken',['chicken','drumstick','maryland','chook','turkey']],
  ['Lamb',['lamb','mutton']],
  ['Pork',['pork','bacon','chorizo','ham','prosciutto','pancetta','salami','sausage']],
  ['Beef',['beef','steak','brisket','mince','veal','oxtail']]
];
function guessKind(r){
  if(!r.ingredients||!r.ingredients.length) return 'Other';
  const all=' '+r.ingredients.map(i=>norm(i.item)).join(' | ')+' ';
  for(const [kind,words] of KIND_WORDS){ if(words.some(w=>all.includes(w))) return kind; }
  return 'Vegetarian';
}

const UNITS = {
  g:'g',gram:'g',grams:'g',kg:'kg',kilo:'kg',kilos:'kg',kilogram:'kg',kilograms:'kg',
  ml:'ml',mls:'ml',l:'l',litre:'l',litres:'l',liter:'l',liters:'l',
  tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',tbsp:'tbsp',tbs:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',
  cup:'cup',cups:'cup',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',
  clove:'clove',cloves:'clove',can:'can',cans:'can',tin:'can',tins:'can',jar:'jar',jars:'jar',
  pinch:'pinch',pinches:'pinch',handful:'handful',handfuls:'handful',bunch:'bunch',bunches:'bunch',
  sprig:'sprig',sprigs:'sprig',slice:'slice',slices:'slice',punnet:'punnet',punnets:'punnet',
  pack:'pack',packs:'pack',packet:'pack',packets:'pack',stick:'stick',sticks:'stick',
  sheet:'sheet',sheets:'sheet',head:'head',heads:'head',rasher:'rasher',rashers:'rasher'
};
const VULGAR = {'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};

/* ---------- storage: window.storage in preview, browser store once hosted ---- */
const hasWS = !!(window.storage && window.storage.get);
let saveTimer = null;

async function rawGet(k){
  if(hasWS){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
  try{ return window.localStorage.getItem(k); }catch(e){ return null; }
}
async function rawSet(k,v){
  if(hasWS){ try{ await window.storage.set(k,v); return true; }catch(e){ return false; } }
  try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; }
}
function persist(){
  state.updated = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const ok = await rawSet(KEY, JSON.stringify(payload()));
    if(!ok) toast('Could not save — storage may be full, try removing a photo');
  },200);
}
function payload(){
  return { title:state.title, recipes:state.recipes, extras:state.extras, checked:state.checked,
           aisles:state.aisles, overrides:state.overrides, packs:state.packs||[], updated:state.updated };
}

/* ---------- state ------------------------------------------------ */
let state = null;
let sync = { token:'', gist:'', lastPush:null, lastPull:null };
let ui = { tab:'recipes', filter:'all', kind:'any', q:'', draft:[], draftPhoto:null, draftLabels:[], editingId:null };
let photoTarget = null; /* 'draft' or a recipe id */

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId = id => state.recipes.find(r=>r.id===id);
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function fmtAmount(n){
  if(n==null) return '';
  const whole=Math.floor(n+1e-9), frac=n-whole;
  const marks=[[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.875,'⅞']];
  for(const [v,g] of marks){ if(Math.abs(frac-v)<0.02) return (whole?whole:'')+g; }
  if(frac<0.02) return String(whole);
  return String(Math.round(n*100)/100);
}
function fmtDate(iso){
  const d=new Date(iso+'T12:00:00');
  return isNaN(d)?iso:d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}
function fmtStamp(iso){
  if(!iso) return 'never';
  const d=new Date(iso);
  return isNaN(d)?'never':d.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
}
function guessAisle(item){
  const s=' '+norm(item)+' ';
  for(const [aisle,words] of RULES){
    if(words.some(w=>s.includes(w))) return aisle;
  }
  return 'Other';
}
function aisleFor(item,stored){
  return state.overrides[norm(item)] || stored || guessAisle(item);
}

/* Shrink to a 480px JPEG — a phone photo is 4MB, this is about 25KB. */
function shrinkPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type)) return reject(new Error('That is not an image'));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('Could not read that photo'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Could not open that photo'));
      img.onload=()=>{
        const max=480;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const c=document.createElement('canvas');
        c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        try{ resolve(c.toDataURL('image/jpeg',0.62)); }
        catch(e){ reject(new Error('Could not shrink that photo')); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  photoTarget=target;

function parseLine(raw){
  let s=String(raw).replace(/\s+/g,' ').trim();
  s=s.replace(/^[-–•*·]\s*/,'').replace(/^\d+[.)]\s+(?=\D)/,'');
  if(!s) return null;
  let amount=null;
  /* the range separator needs whitespace after "to", or "4 tomatoes" loses its "to" */
  const m=s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])(?:\s*[-–]\s*|\s+to\s+)?(?:\d+(?:[.,]\d+)?|\d+\/\d+)?\s*/);
  if(m){
    const tok=m[1];
    if(VULGAR[tok]) amount=VULGAR[tok];
    else if(tok.includes('/')){
      const parts=tok.split(/\s+/);
      if(parts.length===2){ const [a,b]=parts[1].split('/'); amount=parseFloat(parts[0])+parseFloat(a)/parseFloat(b); }
      else { const [a,b]=tok.split('/'); amount=parseFloat(a)/parseFloat(b); }
    } else amount=parseFloat(tok.replace(',','.'));
    s=s.slice(m[0].length).trim();
    const v=s.match(/^([¼½¾⅓⅔⅛⅜⅝⅞])\s*/);
    if(v){ amount+=VULGAR[v[1]]; s=s.slice(v[0].length).trim(); }
  }
  let unit=null;
  const w=s.match(/^([A-Za-z]+)\.?\s+/);
  if(w){ const k=w[1].toLowerCase(); if(UNITS[k]){ unit=UNITS[k]; s=s.slice(w[0].length).trim(); } }
  s=s.replace(/^of\s+/i,'').trim();
  if(!s) return null;
  return { amount, unit, item:s, section:guessAisle(s) };
}

/* ---------- shopping list ---------------------------------------- */
function buildList(){
  const bag={};
  const add=(aisle,key,obj)=>{
    bag[aisle]=bag[aisle]||{};
    const g=bag[aisle][key];
    if(g){
      if(g.amount!=null&&obj.amount!=null) g.amount+=obj.amount;
      else if(obj.amount!=null) g.amount=obj.amount;
      obj.from.forEach(f=>{ if(!g.from.includes(f)) g.from.push(f); });
    } else bag[aisle][key]=obj;
  };
  state.recipes.filter(r=>r.queued).forEach(r=>{
    const mult=r.mult||1;
    r.ingredients.forEach(ing=>{
      const name=ing.item.trim();
      const aisle=aisleFor(name,ing.section);
      const key=norm(name)+'|'+(ing.unit||'');
      add(aisle,key,{ amount:ing.amount==null?null:ing.amount*mult, unit:ing.unit,
                      item:name, from:[r.title], key:aisle+'::'+key });
    });
  });
  state.extras.forEach(e=>{
    const aisle=aisleFor(e.item,e.section);
    const key=norm(e.item)+'|'+(e.unit||'')+'|x';
    add(aisle,key,{ amount:e.amount, unit:e.unit, item:e.item, from:['Added by hand'], key:aisle+'::'+key });
  });
  const known=state.aisles.filter(a=>bag[a]);
  const stray=Object.keys(bag).filter(a=>!state.aisles.includes(a));
  return known.concat(stray).map(a=>({
    aisle:a, items:Object.values(bag[a]).sort((x,y)=>x.item.localeCompare(y.item))
  }));
}
const lineText = it => [fmtAmount(it.amount), it.unit, it.item].filter(Boolean).join(' ');

function listAsText(){
  const lines=[];
  buildList().forEach(g=>{
    g.items.forEach(it=>{ if(!state.checked[it.key]) lines.push(lineText(it)); });
  });
  return lines.length?lines.join('\n'):null;
}
async function copyText(text,okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); return true; }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand&&document.execCommand('copy');
    ta.remove(); toast(ok?okMsg:'Copy blocked — use Show as text');
    return ok;
  }
}

/* ---------- cloud sync via a secret GitHub gist ------------------ */
const FILE='supper-club.json';
async function ghFetch(path,opts={}){
  if(!sync.token) throw new Error('Add your GitHub token in Settings first');
  const res=await fetch('https://api.github.com'+path,Object.assign({
    headers:{ 'Authorization':'Bearer '+sync.token, 'Accept':'application/vnd.github+json' }
  },opts));
  if(!res.ok) throw new Error('GitHub said '+res.status+(res.status===401?' — check the token':''));
  return res.json();
}
let remoteAt = null;   /* when the gist last changed, per GitHub */

/* Is there anything to push, or anything waiting to be pulled? */
function syncState(){
  if(!sync.token||!sync.gist) return null;
  const seen=[sync.lastPull,sync.lastPush].filter(Boolean).sort().pop();
  if(remoteAt&&(!seen||remoteAt>seen)) return 'pull';
  if(state.updated&&(!sync.lastPush||state.updated>sync.lastPush)) return 'push';
  return null;
}
function syncBanner(){
  const s=syncState();
  if(s==='pull') return `<div class="notice" style="display:flex;gap:10px;align-items:center">
    <span style="flex:1">The other phone has newer recipes.</span>
    <button class="btn sm dark" data-action="pull">Pull down</button></div>`;
  if(s==='push') return `<div class="notice" style="display:flex;gap:10px;align-items:center">
    <span style="flex:1">You have changes she cannot see yet.</span>
    <button class="btn sm dark" data-action="push">Push up</button></div>`;
  return '';
}
async function checkRemote(){
  if(!sync.token||!sync.gist) return;
  try{
    const j=await ghFetch('/gists/'+sync.gist+'/commits?per_page=1');
    if(Array.isArray(j)&&j[0]&&j[0].committed_at){ remoteAt=j[0].committed_at; render(); }
  }catch(e){ /* offline or bad token — stay quiet */ }
}

async function saveSync(){ await rawSet(SYNC_KEY,JSON.stringify(sync)); }
async function cloudCreate(){
  const j=await ghFetch('/gists',{ method:'POST', body:JSON.stringify({
    description:'Marquez Meals data', public:false,
    files:{ [FILE]:{ content:JSON.stringify(payload()) } } }) });
  sync.gist=j.id; sync.lastPush=new Date().toISOString();
  await saveSync(); return j.id;
}
async function cloudPush(){
  if(!sync.gist) return cloudCreate();
  await ghFetch('/gists/'+sync.gist,{ method:'PATCH', body:JSON.stringify({
    files:{ [FILE]:{ content:JSON.stringify(payload()) } } }) });
  sync.lastPush=new Date().toISOString(); await saveSync();
}
async function cloudPull(){
  const j=await ghFetch('/gists/'+sync.gist);
  const f=j.files&&j.files[FILE];
  if(!f) throw new Error('No Supper Club file in that gist');
  const next=JSON.parse(f.content);
  if(!next||!Array.isArray(next.recipes)) throw new Error('That file looks wrong');
  if(state.updated&&next.updated&&next.updated<state.updated){
    if(!confirm('The cloud copy is older than this phone. Overwrite what is here anyway?')) return false;
  }
  adopt(next); sync.lastPull=new Date().toISOString(); await saveSync();
  await rawSet(KEY,JSON.stringify(payload()));
  return true;
}

  const q=state.recipes.filter(r=>r.queued).length;
  document.getElementById('barSub').textContent=q?q+' on this week':'';
  document.getElementById('listBadgeWrap').innerHTML=q?'<span class="badge">'+q+'</span>':'';
  document.querySelectorAll('nav button').forEach(b=>{
    if(b.dataset.tab===ui.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const gear=document.querySelector('[data-action="settings"]');
  if(gear) gear.style.color=syncState()?'var(--citrus)':'var(--steel)';
  const pane=document.getElementById('pane');
  pane.innerHTML=({recipes:viewRecipes,list:viewList,archive:viewArchive,add:viewAdd})[ui.tab]();
  window.scrollTo(0,0);
  if(ui.tab==='add') setTimeout(()=>{ const f=pane.querySelector('#f_title'); if(f) f.focus(); },60);
}

function viewRecipes(){
  const q=ui.q.toLowerCase();
  let rs=state.recipes.filter(r=>{
    if(ui.filter==='todo'&&r.madeLog.length) return false;
    if(ui.filter==='made'&&!r.madeLog.length) return false;
    if(ui.filter==='week'&&!r.queued) return false;
    if(ui.kind!=='any'){
      if(ui.kind.startsWith('tag:')){ if(!hasLabel(r,ui.kind.slice(4))) return false; }
      else if((r.kind||guessKind(r))!==ui.kind) return false;
    }
    if(!q) return true;
    return (r.title+' '+r.tags.join(' ')+' '+r.ingredients.map(i=>i.item).join(' ')).toLowerCase().includes(q);
  }).slice().sort((a,b)=>(b.queued?1:0)-(a.queued?1:0)||a.title.localeCompare(b.title));

  const chips=[['all','Everything'],['week','This week'],['todo','Not made yet'],['made','Made before']]
    .map(([k,l])=>`<button class="chip" data-action="filter" data-v="${k}" aria-pressed="${ui.filter===k}">${l}</button>`).join('');

  const counts={};
  state.recipes.forEach(r=>{ const k=r.kind||guessKind(r); counts[k]=(counts[k]||0)+1; });
  const lCounts={};
  LABELS.forEach(([tag])=>{ lCounts[tag]=state.recipes.filter(r=>hasLabel(r,tag)).length; });
  const kindChips=[['any','Any',null]]
    .concat(KINDS.filter(k=>counts[k]).map(k=>[k,k,counts[k]]))
    .concat(LABELS.filter(([tag])=>lCounts[tag]).map(([tag,lab])=>['tag:'+tag,lab,lCounts[tag]]))
    .map(([k,l,c])=>`<button class="chip" data-action="kind" data-v="${k}" aria-pressed="${ui.kind===k}">${l}${c?' '+c:''}</button>`).join('');

  const cards=rs.map(r=>{
    const n=r.ingredients.length;
    const kind=r.kind||guessKind(r);
    const meta=(n?`${kind} · serves ${r.servings||'—'} · ${n} ingredient${n===1?'':'s'}`:'Just a link, no ingredients yet')
      +(r.madeLog.length?` · made ${r.madeLog.length}×`:'');
    const mult=r.queued?`<div class="mult">Cooking ${[1,2,3].map(x=>
      `<button data-action="mult" data-id="${r.id}" data-v="${x}" aria-pressed="${(r.mult||1)===x}">×${x}</button>`).join('')}</div>`:'';
    const thumb=r.photo
      ? `<img class="thumb" src="${r.photo}" alt="">`
      : `<span class="thumb ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 6v12M8 9h8"/></svg></span>`;
    return `<article class="card ${r.queued?'on':''}">
      <button class="tick" data-action="queue" data-id="${r.id}" aria-pressed="${!!r.queued}" aria-label="Cook ${esc(r.title)} this week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12.5l5 5L20 6.5"/></svg></button>
      <div class="body" data-action="open" data-id="${r.id}" role="button" tabindex="0" style="display:flex;gap:11px;align-items:flex-start">
        ${thumb}
        <span style="flex:1;min-width:0">
          <h3>${esc(r.title)}</h3><span class="meta" style="display:block">${esc(meta)}</span>
          ${r.tags.length?`<span class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span>`:''}
        </span>
      </div>${mult}</article>`;
  }).join('');

  return syncBanner()+`<input class="search" type="text" id="q" placeholder="Search recipes or an ingredient" value="${esc(ui.q)}" autocomplete="off">
    <div class="chips">${chips}</div>
    <div class="chips" style="margin-top:-6px">${kindChips}</div>` + (rs.length?cards:
    `<div class="empty"><h3>Nothing here</h3><p>${ui.q||ui.filter!=='all'?'No recipes match that.':'Add a recipe, or park a TikTok link to try later.'}</p>
     <button class="btn dark" data-action="go" data-v="add">Add a recipe</button></div>`);
}

function viewList(){
  const groups=buildList();
  const queued=state.recipes.filter(r=>r.queued);
  const total=groups.reduce((n,g)=>n+g.items.length,0);
  const ticked=groups.reduce((n,g)=>n+g.items.filter(i=>state.checked[i.key]).length,0);

  if(!total) return `<h2>Shopping list</h2><p class="lede">Tick recipes on the Recipes tab and their ingredients collect here, in the order you walk the shop.</p>
    <div class="empty"><h3>Empty trolley</h3><p>Nothing ticked for this week.</p>
    <button class="btn dark" data-action="go" data-v="recipes">Pick some recipes</button></div>`;

  const body=groups.map(g=>`
    <h3 class="sect">${esc(g.aisle)}<span>${g.items.length}</span></h3>
    ${g.items.map(it=>`<div class="item ${state.checked[it.key]?'done':''}">
      <input type="checkbox" data-action="check" data-key="${esc(it.key)}" ${state.checked[it.key]?'checked':''} aria-label="${esc(it.item)}">
      <span class="txt"><span class="amt">${fmtAmount(it.amount)}${it.unit?' '+it.unit:''}</span> ${esc(it.item)}
        <span class="from">${esc(it.from.join(', '))}</span></span>
      <button class="iconbtn" data-action="move" data-item="${esc(it.item)}" data-aisle="${esc(g.aisle)}" aria-label="Move ${esc(it.item)} to another aisle" style="min-width:36px;min-height:36px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h11M12.5 8l4 4-4 4"/></svg></button>
    </div>`).join('')}`).join('');

  return syncBanner()+`<h2>Shopping list</h2>
    <p class="lede">${total} item${total===1?'':'s'} from ${queued.length} recipe${queued.length===1?'':'s'}${ticked?`, ${ticked} ticked off`:''}. Ticked items are left out of the copy. The arrow moves an item to a different aisle and remembers it.</p>
    <div class="row" style="margin-bottom:6px">
      <input type="text" id="extra" placeholder="Add something else — milk, bin bags" autocomplete="off" style="flex:1;min-width:60%">
      <button class="btn sm" data-action="add-extra">Add</button></div>
    ${body}
    <div class="sticky-actions">
      <button class="btn primary wide" data-action="copy">Copy list</button>
      <div class="row" style="margin-top:9px">
        <button class="btn quiet sm" data-action="show-text">Show as text</button>
        ${ticked?'<button class="btn quiet sm" data-action="untick">Untick all</button>':''}
        <button class="btn quiet sm" data-action="clear-week">Clear the week</button>
      </div></div>`;
}

    .sort((a,b)=>b.madeLog[b.madeLog.length-1].date.localeCompare(a.madeLog[a.madeLog.length-1].date));
  if(!rs.length) return `<h2>Made it</h2><p class="lede">Cook something, mark it made, and it lands here with the date.</p>
    <div class="empty"><h3>No history yet</h3><p>Open a recipe you have cooked and tap “We made this”.</p></div>`;
  return `<h2>Made it</h2><p class="lede">${rs.length} recipe${rs.length===1?'':'s'} cooked so far.</p>`+
    rs.map(r=>{
      const last=r.madeLog[r.madeLog.length-1];

/* ---------- form plumbing ---------------------------------------- */
function formSnapshot(){
  const g=id=>document.getElementById(id);
  if(!g('f_title')) return null;
  return { title:g('f_title').value, source:g('f_source').value, serves:g('f_serves').value,
           kind:g('f_kind').value, tags:g('f_tags').value, steps:g('f_steps').value, notes:g('f_notes').value };
}
function formRestore(f){
  if(!f) return;
  const g=id=>document.getElementById(id);
  if(!g('f_title')) return;
  g('f_title').value=f.title; g('f_source').value=f.source; g('f_serves').value=f.serves;
  g('f_kind').value=f.kind; g('f_tags').value=f.tags; g('f_steps').value=f.steps; g('f_notes').value=f.notes;
}
function collectForm(){
  const g=id=>document.getElementById(id);
  const title=g('f_title').value.trim();
  if(!title){ toast('Give it a name first'); g('f_title').focus(); return null; }
  const ings=ui.draft.length?ui.draft:(ui.editingId?byId(ui.editingId).ingredients:[]);
  return { title, source:g('f_source').value.trim(),
    servings:Math.max(1,parseInt(g('f_serves').value,10)||2),
    kind:g('f_kind').value||null,
    photo:ui.draftPhoto||null,
    tags:ui.draftLabels.concat(g('f_tags').value.split(',').map(s=>s.trim()).filter(Boolean)),
    ingredients:ings,
    steps:g('f_steps').value.split('\n').map(s=>s.trim()).filter(Boolean),
    notes:g('f_notes').value.trim() };
}
function addExtra(){
  const inp=document.getElementById('extra');
  const parsed=parseLine(inp?inp.value:'');
  if(!parsed){ toast('Type something to add'); return; }
  state.extras.push(parsed); persist(); render();
  const again=document.getElementById('extra'); if(again) again.focus();
  toast('Added to the list');
}

/* ---------- events ----------------------------------------------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id, v=el.dataset.v;

  if(a==='close-sheet'){ closeSheet(); return; }
  if(a==='settings'){ openSettings(); return; }
  if(a==='go'){ ui.tab=v; ui.editingId=null; ui.draft=[]; ui.draftLabels=[]; render(); return; }
  if(a==='filter'){ ui.filter=v; render(); return; }
  if(a==='kind'){ ui.kind=v; render(); return; }
  if(a==='label'){
    const snap=formSnapshot();
    const i=ui.draftLabels.indexOf(v);
    if(i>=0) ui.draftLabels.splice(i,1); else ui.draftLabels.push(v);
    render(); formRestore(snap); return; }
  if(a==='photo'){ pickPhoto(id); return; }
  if(a==='photo-del'){
    if(id==='draft'){ const snap=formSnapshot(); ui.draftPhoto=null; render(); formRestore(snap); }
    else { const r=byId(id); r.photo=null; persist(); openRecipe(id); render(); }
    return; }

  if(a==='queue'){ const r=byId(id); r.queued=!r.queued; if(r.queued&&!r.mult) r.mult=1;
    persist(); closeSheet(); render(); toast(r.queued?'On this week':'Off the week'); return; }
  if(a==='mult'){ byId(id).mult=parseInt(v,10); persist(); render(); return; }
  if(a==='open'){ openRecipe(id); return; }
  if(a==='made'){ openMade(id); return; }
  if(a==='made-save'){ const r=byId(id);
    r.madeLog.push({date:new Date().toISOString().slice(0,10),verdict:v});
    r.queued=false; persist(); closeSheet(); ui.tab='archive'; render(); toast('Logged — nice work'); return; }
  if(a==='requeue'){ const r=byId(id); r.queued=true; r.mult=r.mult||1; persist(); ui.tab='recipes'; render(); toast('Back on this week'); return; }
  if(a==='edit'){ const r=byId(id); ui.editingId=id; ui.draft=r.ingredients.slice();
    ui.draftPhoto=r.photo||null;
    ui.draftLabels=LABELS.map(l=>l[0]).filter(t=>hasLabel(r,t));
    closeSheet(); ui.tab='add'; render(); return; }
  if(a==='cancel-edit'){ ui.editingId=null; ui.draft=[]; ui.draftPhoto=null; ui.draftLabels=[]; ui.tab='recipes'; render(); return; }
  if(a==='delete'){ const r=byId(id);
    if(!confirm('Delete “'+r.title+'” for good?')) return;
    state.recipes=state.recipes.filter(x=>x.id!==id); persist(); closeSheet(); render(); toast('Deleted'); return; }

  if(a==='parse-ing'){
    const ta=document.getElementById('f_ing');
    const parsed=ta.value.split('\n').map(parseLine).filter(Boolean);
    if(!parsed.length){ toast('Nothing to read there'); return; }
    ui.draft=ui.draft.concat(parsed);
    const snap=formSnapshot(); render(); formRestore(snap);
    toast(parsed.length+' ingredient'+(parsed.length===1?'':'s')+' added'); return; }
  if(a==='del-ing'){ const snap=formSnapshot(); ui.draft.splice(parseInt(el.dataset.i,10),1); render(); formRestore(snap); return; }
  if(a==='save-recipe'){
    const data=collectForm(); if(!data) return;
    if(ui.editingId){ Object.assign(byId(ui.editingId),data); toast('Saved'); }
    else { state.recipes.push(Object.assign({id:uid(),queued:false,mult:1,madeLog:[]},data)); toast('Added to the book'); }
    ui.editingId=null; ui.draft=[]; ui.draftPhoto=null; ui.draftLabels=[]; ui.tab='recipes'; persist(); render(); return; }

  if(a==='copy'){ const t=listAsText(); if(!t){ toast('Nothing to copy yet'); return; }
    copyText(t,'Copied — paste it into Keep'); return; }
  if(a==='show-text'){ openTextList(); return; }
  if(a==='untick'){ state.checked={}; persist(); render(); return; }
  if(a==='clear-week'){ if(!confirm('Take everything off this week?')) return;
    state.recipes.forEach(r=>r.queued=false); state.extras=[]; state.checked={};
    persist(); render(); toast('Week cleared'); return; }
  if(a==='add-extra'){ addExtra(); return; }
  if(a==='move'){ openMove(el.dataset.item,el.dataset.aisle); return; }
  if(a==='move-save'){ state.overrides[norm(el.dataset.item)]=v; persist(); closeSheet(); render(); toast('Moved to '+v); return; }

  if(a==='rename'){ state.title=document.getElementById('s_name').value.trim()||'Marquez Meals';
    persist(); closeSheet(); render(); toast('Renamed'); return; }
  if(a==='save-aisles'){
    const list=document.getElementById('s_aisles').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(list.length<2){ toast('Needs a few aisles'); return; }
    if(!list.includes('Other')) list.push('Other');
    state.aisles=list; persist(); closeSheet(); ui.tab='list'; render(); toast('Aisle order saved'); return; }
  if(a==='save-sync'){
    sync.token=document.getElementById('s_token').value.trim();
    const g=document.getElementById('s_gist').value.trim();
    if(g) sync.gist=g;   /* a blank box no longer clears it — that made duplicate gists */
    await saveSync(); openSettings(); toast('Sync details saved'); return; }
  if(a==='push'){
    try{ toast('Pushing…'); const wasNew=!sync.gist; await cloudPush();
      remoteAt=sync.lastPush; openSettings(); render();
      toast(wasNew?'Cloud file created — copy the gist id to her phone':'Pushed up'); }
    catch(err){ toast(err.message); } return; }
  if(a==='pull'){
    try{ if(!sync.gist){ toast('Add the gist id first'); return; }
      toast('Pulling…'); if(await cloudPull()){ closeSheet(); render(); toast('Pulled down'); } }
    catch(err){ toast(err.message); } return; }
  if(a==='import'){
    const raw=document.getElementById('s_import').value.trim();
    if(!raw){ toast('Paste something first'); return; }
    let list;
    try{ list=JSON.parse(raw); }catch(err){ toast('That is not valid JSON'); return; }
    if(list&&Array.isArray(list.recipes)) list=list.recipes;
    if(!Array.isArray(list)) list=[list];
    const have=new Set(state.recipes.map(r=>norm(r.title)));
    let n=0, skipped=0;
    list.forEach(p=>{
      if(!p||!p.title) return;
      if(have.has(norm(p.title))){ skipped++; return; }
      const ings=(p.ingredients||[]).map(i=>{
        if(typeof i==='string'){ const q=parseLine(i); return q||null; }
        return { amount:i.amount==null?null:i.amount, unit:i.unit||null,
                 item:i.item||i.name||'', section:i.section||null };
      }).filter(i=>i&&i.item);
      const rec={ id:uid(), title:String(p.title).trim(), photo:p.photo||null,
        servings:parseInt(p.servings,10)||2, mult:1, queued:false,
        source:p.source||p.link||'', tags:(p.tags||[]).map(String),
        ingredients:ings, steps:(p.steps||p.method||[]).map(String),
        notes:p.notes||'', madeLog:[] };
      rec.kind=p.kind||guessKind(rec);
      state.recipes.push(rec); have.add(norm(rec.title)); n++;
    });
    persist(); closeSheet(); ui.tab='recipes'; render();
    toast(n?n+' imported'+(skipped?', '+skipped+' already there':''):'Nothing new to add');
    return; }
  if(a==='backup-copy'){ copyText(JSON.stringify(payload()),'Backup copied'); return; }
  if(a==='backup-paste'){
    const raw=prompt('Paste the backup text:'); if(!raw) return;
    try{ const next=JSON.parse(raw);
      if(!next||!Array.isArray(next.recipes)) throw new Error('bad');
      adopt(next); persist(); closeSheet(); render(); toast('Backup loaded'); }
    catch(err){ toast('That did not look like a backup'); } return; }
});

document.getElementById('photoInput').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file||!photoTarget) return;
  try{
    toast('Shrinking the photo…');
    const data=await shrinkPhoto(file);
    if(photoTarget==='draft'){
      const snap=formSnapshot(); ui.draftPhoto=data; render(); formRestore(snap); toast('Photo added');
    } else {
      const r=byId(photoTarget);
      if(r){ r.photo=data; persist(); openRecipe(r.id); render(); toast('Photo added'); }
    }
  }catch(err){ toast(err.message); }
  photoTarget=null; e.target.value='';
});

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  if(el.dataset.action==='check'){
    const k=el.dataset.key;
    if(el.checked) state.checked[k]=true; else delete state.checked[k];
    persist(); el.closest('.item').classList.toggle('done',el.checked); return;
  }
  if(el.dataset.action==='set-aisle'){
    const i=parseInt(el.dataset.i,10);
    if(ui.draft[i]){ ui.draft[i].section=el.value; state.overrides[norm(ui.draft[i].item)]=el.value; persist(); }
    return;
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='q'){
    ui.q=e.target.value; clearTimeout(window._qt);
    window._qt=setTimeout(()=>{ const pos=ui.q.length; render();
      const f=document.getElementById('q'); if(f){ f.focus(); f.setSelectionRange(pos,pos); } },260);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter'&&e.target.id==='extra'){ e.preventDefault(); addExtra(); }
  if(e.key==='Enter'&&e.target.classList.contains('body')) e.target.click();
});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  ui.tab=b.dataset.tab;
  if(ui.tab!=='add'){ ui.editingId=null; ui.draft=[]; ui.draftPhoto=null; ui.draftLabels=[]; }
  render();
}));

function applyPack(){
  if(!state.packs) state.packs=[];
  if(state.packs.includes(PACK_ID)) return 0;
  const have=new Set(state.recipes.map(r=>norm(r.title)));
  let n=0;
  PACK.forEach(p=>{
    if(have.has(norm(p.title))) return;
    state.recipes.push({ id:uid(), title:p.title, kind:p.kind||null, photo:null,
      servings:p.servings||2, mult:1, queued:false, source:'',
      tags:(p.tags||[]).concat('old book'),
      ingredients:(p.ingredients||[]).map(i=>({amount:i.amount==null?null:i.amount,
        unit:i.unit||null, item:i.item, section:null})),
      steps:p.steps||[], notes:'', madeLog:[] });
    n++;
  });
  state.packs.push(PACK_ID);
  return n;
}

const PACK2=[{"title":"Avocado Egg Toast","servings":2,"ingredients":["2 slices sourdough","1 avocado","2 eggs","1 tsp lemon juice","1 tbsp olive oil","0.5 tsp chilli flakes","0.5 tsp salt"],"steps":["Toast the bread hard — it needs to hold up under the avocado.","Mash the avocado with the lemon juice and salt, leaving it chunky.","Fry the eggs in the olive oil until the whites are set and the edges are crisp.","Spread, top with the eggs, finish with chilli flakes and more salt."]},{"title":"Bibimbap","servings":2,"ingredients":["1.5 cups short grain rice","200 g beef mince","1 carrot, julienned","1 zucchini, julienned","100 g bean sprouts","100 g spinach","2 eggs","2 tbsp gochujang","1 tbsp sesame oil","2 tbsp soy sauce","2 clove garlic","1 tsp sugar","1 tsp sesame seeds","1 tbsp vegetable oil"],"steps":["Cook the rice. Mix the gochujang with the sesame oil and sugar for the sauce.","Blanch the spinach and bean sprouts separately, squeeze dry, dress each with a little sesame oil and salt.","Fry the carrot and zucchini separately in a hot pan, a couple of minutes each, keeping them distinct.","Brown the mince with the garlic and soy sauce.","Fry the eggs sunny side up. Build bowls with rice underneath, vegetables and beef arranged on top in sections, egg in the middle.","Sauce on the side so you can mix to taste."],"notes":"The point is keeping everything separate until you stir it."},{"title":"Breakfast Burrito","servings":2,"ingredients":["2 large tortillas","4 eggs","150 g chorizo, diced","1 potato, diced small","0.5 cup grated cheddar","2 tbsp sour cream","1 tbsp hot sauce","1 tbsp vegetable oil","0.5 tsp salt"],"steps":["Fry the potato in the oil over medium heat for 10 minutes until crisp, then add the chorizo for 3 minutes.","Scramble the eggs softly in a separate pan — they keep cooking inside the wrap.","Warm the tortillas in a dry pan so they fold without splitting.","Layer eggs, potato and chorizo, cheese, sour cream and hot sauce down the middle, fold the ends in, roll tight.","Toast the rolled burrito seam-side down for 2 minutes to seal it."]},{"title":"Bruschetta","servings":4,"ingredients":["1 baguette","4 tomatoes","2 clove garlic","0.25 cup basil leaves","3 tbsp olive oil","1 tsp balsamic","0.5 tsp salt"],"steps":["Dice the tomatoes, salt them, and leave them in a sieve for 15 minutes so they do not flood the bread.","Slice the baguette on an angle, brush with oil, grill or griddle until charred at the edges.","Rub a raw garlic clove over each hot slice.","Toss the drained tomatoes with the remaining oil, balsamic and torn basil, then spoon on just before serving."],"notes":"Assemble at the last minute or it goes soggy."},{"title":"Burger Sliders","servings":4,"ingredients":["500 g beef mince","12 slider buns","1 onion, very finely diced","6 slice cheddar","2 tbsp butter","2 tbsp tomato sauce","1 tbsp mustard","1 tsp salt","0.5 tsp black pepper"],"steps":["Heat the oven to 180C. Press the mince into one thin even sheet on a lined tray, the size of your buns laid out together.","Scatter the onion over, season, and bake 15 minutes. Drain off the fat.","Lay the cheese over the whole sheet and return for 2 minutes to melt.","Butter the cut buns and toast them. Cut the meat sheet into squares and sandwich.","Sauce and mustard on the lids."],"notes":"Cooking the patty as one sheet is the trick — no individual flipping."},{"title":"Butter Braised Asparagus","servings":2,"ingredients":["2 bunch asparagus","40 g butter","0.25 cup water","1 clove garlic","1 tsp lemon juice","0.5 tsp salt"],"steps":["Snap the woody ends off the asparagus.","Melt the butter with the water and crushed garlic in a wide pan over medium heat.","Lay the asparagus in one layer, cover, and cook 4 to 6 minutes depending on thickness.","Uncover, let the liquid reduce to a glaze, then add lemon and salt."]},{"title":"Cheese Quesadilla","servings":2,"ingredients":["4 tortillas","2 cups grated cheddar","1 tbsp butter","2 spring onion","1 tbsp pickled jalapenos"],"steps":["Butter one side of a tortilla and lay it butter-side down in a cold pan.","Cover half with cheese, spring onion and jalapenos, fold over.","Cook over medium-low for 3 minutes a side — low and slow so the cheese melts before the outside burns.","Rest a minute before cutting or the filling runs out."]},{"title":"Chia Pudding","servings":2,"ingredients":["0.33 cup chia seeds","1.5 cups milk","1 tbsp maple syrup","0.5 tsp vanilla","0.5 cup berries","2 tbsp granola"],"steps":["Whisk the chia, milk, maple syrup and vanilla together.","Wait 10 minutes and whisk again — this second whisk stops it setting in one lump.","Cover and refrigerate at least 4 hours or overnight.","Top with berries and granola."],"notes":"Make it the night before."},{"title":"Chicken Parmigiana","servings":4,"ingredients":["4 chicken breasts","1 cup plain flour","2 eggs","2 cups panko breadcrumbs","1 cup passata","1.5 cups grated mozzarella","0.5 cup grated parmesan","4 slice ham","1 cup vegetable oil","1 tsp salt","1 tsp dried oregano"],"steps":["Butterfly each breast and beat it to an even 1cm — thin cooks through before the crumb burns.","Season the flour, beat the eggs, mix the parmesan through the panko. Flour, egg, crumb each piece, pressing the crumb on firmly.","Shallow fry in 1cm of oil, 3 to 4 minutes a side, until deep golden. Drain on a rack, not paper.","Heat the oven to 200C. Top each with passata, ham, then mozzarella.","Bake 10 minutes until the cheese blisters."],"notes":"Crumb them in the morning and chill — the coating sticks better."},{"title":"Chipotle Cilantro Lime Rice","servings":4,"ingredients":["1.5 cups long grain rice","3 cups water","2 tbsp vegetable oil","1 bay leaf","2 tbsp lime juice","0.5 cup coriander","1 tsp salt"],"steps":["Rinse the rice until the water runs clear.","Cook it with the water, oil, bay leaf and salt, lid on, 18 minutes, then rest 10 minutes off the heat without lifting the lid.","Fluff with a fork, discard the bay leaf.","Fold through the lime juice and finely chopped coriander while still warm."]},{"title":"Cold Soba Noodles","servings":2,"ingredients":["200 g soba noodles","0.5 cup soy sauce","0.25 cup mirin","1 cup water","1 tsp sugar","2 spring onion","1 sheet nori","1 tbsp sesame seeds","1 tsp wasabi"],"steps":["Simmer the soy, mirin, water and sugar for 2 minutes, then chill it completely. This is the dipping sauce.","Boil the soba 4 to 5 minutes, then rinse hard under cold water, rubbing the noodles to wash off the starch.","Drain thoroughly and pile onto plates.","Serve with the cold sauce, sliced spring onion, shredded nori, sesame and a dab of wasabi."],"notes":"Rinsing properly is the whole dish."},{"title":"Corn Ribs","servings":2,"ingredients":["3 corn cobs","2 tbsp vegetable oil","1 tsp paprika","0.5 tsp garlic powder","0.5 tsp cumin","0.5 tsp salt","2 tbsp mayonnaise","1 tbsp lime juice","2 tbsp crumbled feta"],"steps":["Microwave the whole cobs 2 minutes to soften them — it makes cutting much safer.","Stand each cob up and cut down through it into quarters lengthways.","Toss with the oil and spices. Air fry at 200C for 12 minutes, or oven 220C for 20 minutes, until they curl.","Mix the mayo and lime, drizzle over, scatter with feta."],"notes":"They curl as they cook, that is how you know."},{"title":"Crispy Parmesan Roasted Brussel Sprouts","servings":4,"ingredients":["500 g brussels sprouts","2 tbsp olive oil","0.5 cup grated parmesan","2 clove garlic","0.5 tsp salt","0.5 tsp black pepper","1 tsp lemon juice"],"steps":["Heat the oven to 220C with the tray already in it.","Halve the sprouts. Toss with oil, garlic, salt and pepper.","Spread cut-side down on the hot tray in a single layer, no crowding. Roast 20 minutes without stirring.","Scatter the parmesan over and give it 5 more minutes, then hit with lemon."],"notes":"Cut side down and a hot tray, or they steam instead of crisping."},{"title":"Crispy Roast Potato","servings":4,"ingredients":["1 kg potatoes","0.25 cup vegetable oil","1 tsp baking soda","2 sprig rosemary","4 clove garlic","1 tsp salt"],"steps":["Cut the potatoes into large chunks. Boil in salted water with the baking soda for 10 minutes, until the edges look shaggy.","Drain and leave to steam dry in the colander for 5 minutes, then shake it to rough the surfaces up.","Heat the oil in a tray at 220C until it shimmers, add the potatoes carefully, turn to coat.","Roast 25 minutes, turn, add rosemary and crushed garlic, roast 20 more."],"notes":"The baking soda in the water is what gives you the crust."},{"title":"Deviled Eggs","servings":4,"ingredients":["6 eggs","3 tbsp mayonnaise","1 tsp dijon mustard","1 tsp vinegar","0.5 tsp paprika","2 spring onion","0.25 tsp salt"],"steps":["Lower the eggs into already-boiling water and cook 10 minutes, then straight into iced water for 5. They peel cleanly this way.","Halve, pop the yolks into a bowl, mash with mayo, mustard, vinegar and salt until smooth.","Spoon or pipe back into the whites.","Dust with paprika and scatter sliced spring onion."]},{"title":"Egg Drop Soup","servings":2,"ingredients":["4 cups chicken stock","2 eggs","1 tbsp cornflour","2 tbsp water","1 tsp sesame oil","0.25 tsp white pepper","2 spring onion","1 tsp soy sauce"],"steps":["Bring the stock to a bare simmer with the soy and white pepper.","Mix the cornflour with the water and stir it in — it thickens slightly, which holds the egg ribbons up.","Beat the eggs. Take the pot off the boil, then pour the egg in a thin stream while stirring slowly in one direction.","Finish with sesame oil and spring onion."],"notes":"Off the boil, or you get scrambled egg soup."},{"title":"French Onion Soup","servings":4,"ingredients":["1 kg brown onions","60 g butter","2 tbsp olive oil","1 tsp sugar","0.5 cup dry white wine","6 cups beef stock","2 sprig thyme","1 bay leaf","4 slice baguette","1.5 cups grated gruyere","1 tsp salt"],"steps":["Slice the onions thinly. Cook in the butter and oil over medium-low with the sugar and salt for 45 minutes, stirring now and then, until deep brown and jammy. This is the whole recipe, do not rush it.","Deglaze with the wine, scraping the pan.","Add the stock, thyme and bay, simmer 20 minutes.","Toast the baguette. Ladle soup into oven-proof bowls, float the bread, pile on cheese.","Grill until the cheese is bubbling and browned at the edges."],"notes":"The quick version is 45 minutes of onions instead of 90. Still needs the 45."},{"title":"Fried Rice","servings":3,"ingredients":["3 cups cooked cold rice","2 eggs","2 tbsp vegetable oil","3 clove garlic","1 cup frozen peas and corn","2 spring onion","2 tbsp soy sauce","1 tsp sesame oil","0.5 tsp white pepper"],"steps":["The rice must be cold and dry — yesterday's, spread out in the fridge.","Scramble the eggs in the hot oil, break them up and set aside.","Fry the garlic 20 seconds, add the vegetables for a minute, then the rice, pressing it against the pan to break clumps.","Keep it moving on the highest heat for 3 minutes. Add soy around the edge of the pan so it sizzles.","Return the egg, finish with sesame oil, white pepper and spring onion."]},{"title":"Guacamole","servings":4,"ingredients":["3 avocados","0.5 onion, finely diced","1 tomato, seeded and diced","0.25 cup coriander","2 tbsp lime juice","1 chilli, finely chopped","1 tsp salt"],"steps":["Soak the diced onion in cold water for 5 minutes and drain — takes the raw bite out.","Mash the avocado with the lime and salt, keeping it chunky.","Fold in the onion, tomato, chilli and chopped coriander.","Taste for salt and lime, it usually wants more of both."]},{"title":"Honey Butter Glazed Carrots with “sauce”","servings":4,"ingredients":["700 g carrots","40 g butter","2 tbsp honey","0.5 tsp salt","0.5 cup Greek yoghurt","1 clove garlic","1 tbsp lemon juice","2 tbsp chopped dill"],"steps":["Heat the oven to 200C. Cut the carrots into batons, toss with melted butter, honey and salt.","Roast 30 minutes, turning once, until the edges caramelise.","Mix the yoghurt with crushed garlic, lemon and a pinch of salt.","Spread the yoghurt on the plate, pile the hot carrots on top, scatter with dill."]},{"title":"Honey Garlic Chicken/Beef Fried Rice","servings":3,"ingredients":["3 cups cooked cold rice","400 g chicken thigh, diced","3 tbsp honey","4 clove garlic","3 tbsp soy sauce","1 tbsp rice vinegar","2 tbsp vegetable oil","2 eggs","1 cup frozen peas and corn","2 spring onion","1 tsp sesame oil"],"steps":["Mix the honey, soy, vinegar and crushed garlic into a sauce.","Sear the diced chicken hard in the oil until browned, then pour in half the sauce and let it reduce and stick.","Push the chicken aside, scramble the eggs in the same pan.","Add the rice and vegetables, breaking up clumps over high heat for 3 minutes, then the rest of the sauce.","Finish with sesame oil and spring onion."],"notes":"Works the same with thinly sliced beef."},{"title":"Kimchi Jjigae","servings":2,"ingredients":["2 cups aged kimchi","200 g pork belly, sliced","1 block firm tofu","1 tbsp gochujang","1 tsp gochugaru","1 tbsp soy sauce","1 tsp sugar","3 clove garlic","2 cups water","1 tsp sesame oil","2 spring onion"],"steps":["Fry the pork in the sesame oil until the fat renders, 4 minutes.","Add the kimchi and cook it hard for 5 minutes — frying the kimchi first is what builds the flavour.","Stir in the gochujang, gochugaru, sugar, soy and garlic, then the water and the kimchi juice.","Simmer 15 minutes. Add sliced tofu and simmer 5 more.","Top with spring onion."],"notes":"Old sour kimchi is better here than fresh."},{"title":"Loaded Nachos","servings":4,"ingredients":["1 bag corn chips","400 g beef mince","1 packet taco seasoning","1 can black beans, drained","2 cups grated cheddar","1 avocado","0.5 cup sour cream","1 cup salsa","2 tbsp pickled jalapenos","2 spring onion"],"steps":["Brown the mince, add the taco seasoning and a splash of water, reduce until thick. Stir the beans through.","Heat the oven to 200C. Build in two shallow layers — chips, meat, cheese, then chips, meat, cheese. One deep pile leaves a dry top and a soggy bottom.","Bake 10 minutes until the cheese is fully melted.","Add the cold toppings after baking, not before."]},{"title":"Loco Moco","servings":2,"ingredients":["2 cups cooked rice","400 g beef mince","2 eggs","1 onion","2 tbsp butter","1 tbsp plain flour","1.5 cups beef stock","1 tbsp soy sauce","1 tsp Worcestershire sauce","0.5 tsp salt","0.5 tsp black pepper"],"steps":["Mix the mince with salt and pepper and half the diced onion, form two thick patties, fry 4 minutes a side. Set aside.","In the same pan, cook the rest of the onion in the butter, stir in the flour and cook 1 minute.","Whisk in the stock, soy and Worcestershire, simmer until it coats a spoon.","Fry the eggs sunny side up.","Rice, patty, gravy over everything, egg on top."]},{"title":"Mac and Cheese","servings":4,"ingredients":["400 g macaroni","60 g butter","0.33 cup plain flour","3 cups milk","2.5 cups grated cheddar","0.5 cup grated gruyere","1 tsp dijon mustard","0.25 tsp nutmeg","1 tsp salt","0.5 cup panko breadcrumbs"],"steps":["Boil the pasta two minutes short of the packet time.","Melt the butter, stir in the flour and cook 2 minutes. Add the milk a little at a time, whisking, until smooth and thick.","Off the heat, stir in the cheese a handful at a time, plus the mustard, nutmeg and salt. Off the heat matters — boiling makes it grainy.","Fold the pasta through, tip into a dish, top with panko.","Grill 5 minutes until browned."]},{"title":"Mexican Bean Dip","servings":4,"ingredients":["1 can refried beans","250 g beef mince","1 packet taco seasoning","1 cup grated cheddar","0.5 cup sour cream","0.5 cup salsa","2 tbsp pickled jalapenos","1 spring onion"],"steps":["Brown the mince with the taco seasoning and a splash of water.","Spread the refried beans in a baking dish, then the mince, then salsa, then cheese.","Bake at 200C for 20 minutes until bubbling at the edges.","Spoon sour cream over and scatter jalapenos and spring onion."]},{"title":"Panna Cotta","servings":4,"ingredients":["2 cups thickened cream","0.5 cup milk","0.33 cup caster sugar","1 tsp vanilla","2 tsp powdered gelatine","2 tbsp cold water","0.5 cup berries"],"steps":["Sprinkle the gelatine over the cold water and leave 5 minutes to bloom.","Heat the cream, milk, sugar and vanilla until steaming but not boiling. Take off the heat.","Stir the bloomed gelatine in until fully dissolved, then strain.","Pour into glasses or moulds and refrigerate at least 4 hours.","Serve with berries."],"notes":"Boiling the cream after the gelatine goes in will stop it setting."},{"title":"Pizza dough","servings":4,"ingredients":["500 g plain flour","325 ml warm water","7 g dried yeast","2 tsp salt","1 tsp sugar","2 tbsp olive oil"],"steps":["Mix the yeast and sugar into the warm water and leave 10 minutes until foamy.","Combine with the flour, salt and oil into a shaggy dough. Knead 10 minutes by hand until smooth and stretchy.","Cover and leave to double, about 1.5 hours in a warm spot.","Knock back, divide into 4, and rest the balls 20 minutes before stretching.","Stretch by hand, never roll. Bake at the highest heat your oven does, on a preheated tray."],"notes":"A slow overnight rise in the fridge tastes better if you have the time."},{"title":"Pumpkin Soup","servings":4,"ingredients":["1.2 kg pumpkin","1 onion","2 clove garlic","3 cups chicken stock","40 g butter","0.5 cup thickened cream","0.5 tsp nutmeg","1 tsp salt","0.5 tsp black pepper"],"steps":["Heat the oven to 200C. Cut the pumpkin into chunks, toss with oil and salt, roast 35 minutes until the edges char. Roasting instead of boiling is the difference.","Soften the onion and garlic in the butter in a large pot.","Add the roast pumpkin and the stock, simmer 10 minutes.","Blend smooth, then stir the cream through off the heat with nutmeg, salt and pepper."]},{"title":"Red Wine Poached Pears","servings":4,"ingredients":["4 pears","2 cups red wine","0.5 cup caster sugar","1 cinnamon stick","2 strip orange peel","1 star anise","1 tsp vanilla"],"steps":["Peel the pears, leaving the stalks on, and trim the bases flat so they stand.","Bring the wine, sugar, cinnamon, peel, star anise and vanilla to a simmer.","Sit the pears in, cover with a round of baking paper to keep them under, and poach 25 to 35 minutes until a skewer slides in.","Lift the pears out and reduce the liquid to a syrup, 10 minutes.","Serve warm or cold with the syrup spooned over."]},{"title":"Roll n Roasters Roast Beef","servings":4,"ingredients":["1 kg beef topside","4 soft rolls","2 tbsp olive oil","1 tsp garlic powder","1 tsp onion powder","1 tsp black pepper","1 tsp salt","200 g cheddar","0.5 cup milk","1 tsp cornflour","1 cup beef stock"],"steps":["Heat the oven to 240C. Rub the beef with oil, salt, pepper, garlic and onion powder.","Roast 15 minutes, drop to 135C and roast until the centre reads 52C, about 45 minutes. Rest 20 minutes.","Slice as thinly as you possibly can, against the grain. Thin slicing is the whole point.","Warm the stock and dip the slices in it briefly before piling into rolls.","For the cheese sauce, warm the milk, whisk in the cornflour, then melt the cheddar in off the heat. Pour over."],"notes":"A homage to the Brooklyn original rather than the real recipe."},{"title":"San Choy Bow","servings":4,"ingredients":["500 g pork mince","1 head iceberg lettuce","1 can water chestnuts, drained","4 dried shiitake mushrooms","3 clove garlic","1 tbsp grated ginger","2 tbsp oyster sauce","1 tbsp soy sauce","1 tsp sesame oil","1 tsp sugar","2 spring onion","1 tbsp vegetable oil"],"steps":["Soak the shiitake in hot water 20 minutes, then chop finely. Keep a little soaking liquid.","Separate the lettuce into cups and keep them in iced water so they stay rigid.","Fry the garlic and ginger in the oil 30 seconds, add the pork and brown it hard, breaking it up.","Add the chopped mushrooms and water chestnuts, then the oyster sauce, soy, sugar and a splash of mushroom liquid. Reduce 3 minutes.","Finish with sesame oil and spring onion, spoon into drained lettuce cups."],"notes":"Water chestnuts are not optional, they are the crunch."},{"title":"Shakshuka","servings":2,"ingredients":["4 eggs","2 can crushed tomatoes","1 onion","1 red capsicum","3 clove garlic","2 tbsp olive oil","1 tsp cumin","1 tsp paprika","0.5 tsp chilli flakes","1 tsp salt","100 g feta","0.25 cup parsley"],"steps":["Soften the sliced onion and capsicum in the oil for 10 minutes.","Add the garlic and spices and fry 1 minute until fragrant.","Add the tomatoes and salt, simmer 15 minutes until properly thick — watery sauce will not hold the eggs.","Make wells with the back of a spoon, crack an egg into each, cover and cook 6 to 8 minutes until the whites set.","Crumble feta over and scatter parsley. Bread to mop."]},{"title":"Smashed Burgers","servings":2,"ingredients":["400 g beef mince","4 slice American cheese","2 burger buns","1 onion, sliced paper thin","2 tbsp butter","2 tbsp mayonnaise","1 tbsp tomato sauce","1 tsp mustard","4 slice pickle","1 tsp salt"],"steps":["Roll the mince into four loose balls. Do not compact them.","Get a heavy pan or flat plate as hot as it will go.","Put a ball down, lay a scatter of onion on top, and smash flat with a spatula for 10 seconds. Thin and ragged is what you want.","Salt, cook 90 seconds until the edges are lacy and brown, flip, cheese on, 45 seconds more.","Butter and toast the buns. Mix the mayo, sauce and mustard. Stack two patties per bun with pickles."],"notes":"High heat and only one smash. Pressing again squeezes the juice out."},{"title":"Spicy Roasted Broccoli","servings":4,"ingredients":["2 head broccoli","2 tbsp olive oil","1 tsp chilli flakes","3 clove garlic","0.5 tsp salt","1 tbsp lemon juice","2 tbsp grated parmesan"],"steps":["Heat the oven to 220C with the tray inside.","Cut the broccoli into florets with flat sides where you can, toss with oil, chilli, sliced garlic :["4 slice white bread","40 g butter, softened","2 cups grated cheddar","4 slice ham","2 tsp dijon mustard"],"steps":["Butter the outside faces of the bread, not the pan.","Mustard on the inside, then cheese, ham, more cheese — cheese against both slices glues it shut.","Cook in a cold pan brought up to medium-low, 4 minutes a side, pressing with a spatula.","Rest 1 minute before cutting."],"notes":"Low heat. High heat burns the bread before the cheese goes."}];
