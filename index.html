itle":"Garlic Shrimp/Mussel/Clam Scampi","servings":2,"ingredients":["400 g prawns","200 g spaghetti","60 g butter","3 tbsp olive oil","6 clove garlic","0.5 tsp chilli flakes","0.5 cup dry white wine","2 tbsp lemon juice","0.25 cup parsley","1 tsp salt"],"steps":["Boil the spaghetti, keeping a mug of the water.","Cook the thinly sliced garlic gently in the oil and half the butter until pale gold, not brown. Burnt garlic ruins it.","Add the chilli flakes and wine, reduce by half.","Add the prawns and cook 2 minutes, turning once, until just opaque.","Off the heat stir in the rest of the butter, the lemon and parsley, then toss the pasta through with a splash of its water."],"notes":"Works the same with mussels or clams — cover and steam them 4 minutes instead."},{"title":"General Tso’s Chicken","servings":4,"ingredients":["700 g chicken thigh, diced","0.5 cup cornflour","1 egg","2 cups vegetable oil","3 tbsp soy sauce","3 tbsp sugar","2 tbsp rice vinegar","1 tbsp hoisin","4 clove garlic","1 tbsp grated ginger","6 dried chillies","1 tsp sesame oil","1 tbsp cornflour","2 tbsp water","2 spring onion"],"steps":["Toss the diced chicken with the egg, then the cornflour, until each piece is dry-coated.","Fry in batches in hot oil for 4 minutes until pale gold, then fry everything again for 2 minutes. The second fry is what keeps it crunchy under sauce.","Mix the soy, sugar, vinegar and hoisin. Slurry the extra cornflour with the water.","In a dry wok, fry the chillies, garlic and ginger 30 seconds, add the sauce, bring to a boil, then the slurry until glossy.","Toss the chicken through off the heat, finish with sesame oil and spring onion."]},{"title":"Green/Red Thai Curry","servings":4,"ingredients":["600 g chicken thigh, sliced","3 tbsp Thai curry paste","2 can coconut milk","2 tbsp fish sauce","1 tbsp brown sugar","1 red capsicum","150 g green beans","1 zucchini","4 kaffir lime leaves","0.5 cup Thai basil","1 tbsp vegetable oil","1 tbsp lime juice"],"steps":["Spoon the thick cream from the top of one coconut milk can into a hot pan with the oil and fry the curry paste in it for 3 minutes until it splits and smells strong. This step is the difference between good and flat.","Add the chicken and coat it in the paste.","Pour in the rest of the coconut milk, the fish sauce, sugar and lime leaves. Simmer 10 minutes.","Add the vegetables and simmer 6 more minutes.","Off the heat, stir in lime juice and Thai basil. Taste — it usually wants more fish sauce."],"notes":"Swap chicken for tofu and fish sauce for soy to make it vegetarian."},{"title":"Hawaiian Garlic Shrimp and Rice","servings":2,"ingredients":["500 g prawns","0.25 cup plain flour","100 g butter","8 clove garlic","1 tsp paprika","0.5 tsp cayenne pepper","1 tbsp lemon juice","0.25 cup parsley","1 tsp salt","3 cups cooked rice"],"steps":["Toss the peeled prawns in the flour with the paprika, cayenne and salt.","Melt half the butter and cook the chopped garlic gently for 2 minutes until fragrant.","Add the prawns in one layer and cook 2 minutes a side.","Add the rest of the butter and the lemon, swirl into a sauce.","Parsley over, spoon everything including the butter onto the rice."],"notes":"It is a garlic butter dish. Do not cut the butter."},{"title":"Honey Glazed Salmon with Lemon","servings":2,"ingredients":["2 salmon fillets","3 tbsp honey","2 tbsp lemon juice","2 clove garlic","1 tbsp soy sauce","1 tbsp butter","1 tbsp olive oil","0.5 tsp salt","0.5 tsp black pepper","1 lemon"],"steps":["Season the salmon and sear it skin-side down in the oil, 4 minutes, undisturbed.","Mix the honey, lemon juice, soy and crushed garlic.","Flip the salmon, add the butter and the honey mixture, and tilt the pan to spoon the glaze over for 3 minutes.","Let the glaze reduce until it coats the fish, then serve with lemon wedges."]},{"title":"Japanese Curry","servings":4,"ingredients":["600 g chicken thigh, diced","2 onions","2 carrots","3 potatoes","1 box Japanese curry roux","4 cups chicken stock","1 tbsp vegetable oil","1 tbsp soy sauce","1 tbsp honey","1 apple, grated","3 cups cooked rice"],"steps":["Brown the chicken in the oil in a heavy pot, then set aside.","Cook the sliced onions 10 minutes until golden — do not skip this, it is where the sweetness comes from.","Add the chunked carrot and potato, the chicken, and the stock. Simmer 20 minutes until the potato is soft.","Turn the heat off. Break the roux blocks in and stir until fully dissolved.","Add the grated apple, soy and honey, simmer 5 more minutes until thick. Serve over rice."],"notes":"Boxed roux is what everyone in Japan uses. It is not cheating."},{"title":"Matzo Ball Soup","servings":4,"ingredients":["1 cup matzo meal","4 eggs","0.25 cup vegetable oil","0.25 cup soda water","1 tsp salt","8 cups chicken stock","2 carrots","2 celery sticks","1 onion","0.25 cup dill","0.5 tsp black pepper"],"steps":["Whisk the eggs with the oil, soda water and salt, then fold in the matzo meal. Refrigerate 1 hour — it must firm up.","Simmer the stock with the sliced carrot, celery and quartered onion for 30 minutes.","Wet your hands and roll the mix into loose balls. Loose, not packed, or they come out like golf balls.","Drop them into a separate pot of gently simmering salted water, cover, and cook 30 minutes without lifting the lid.","Lift the balls into bowls, ladle the soup over, finish with dill and pepper."],"notes":"Cook the balls separately or they cloud the soup."},{"title":"Pavlova","servings":8,"ingredients":["4 egg whites","1 cup caster sugar","1 tsp cornflour","1 tsp white vinegar","0.5 tsp vanilla","300 ml thickened cream","2 cups mixed berries","2 passionfruit"],"steps":["Heat the oven to 150C. Everything must be spotlessly clean and grease free or the whites will not hold.","Beat the whites to soft peaks, then add the sugar a spoonful at a time, beating until the mixture is stiff and you cannot feel grit between your fingers.","Fold in the cornflour, vinegar and vanilla.","Pile onto lined tray in a circle with a slight dip in the middle. Bake 15 minutes, then drop to 120C for 1 hour.","Turn the oven off and leave it in there until completely cold. Cracks come from cooling too fast.","Top with whipped cream, berries and passionfruit just before serving."],"notes":"Make the shell a day ahead, top it at the table."},{"title":"Philly Cheese Steak","servings":2,"ingredients":["400 g beef sirloin","2 hoagie rolls","1 onion","1 green capsicum","6 slice provolone","2 tbsp butter","1 tbsp vegetable oil","1 tsp salt","0.5 tsp black pepper"],"steps":["Freeze the steak 30 minutes, then slice it as thinly as you can against the grain.","Cook the sliced onion and capsicum in the oil for 8 minutes until soft and browned at the edges. Push to one side of the pan.","Throw the beef onto the hot side, spread it out, and cook 2 minutes, chopping it up with the edge of a spatula.","Mix everything together, lay the cheese over the top and let it melt into the meat.","Butter and toast the rolls, then scoop the lot straight in."]},{"title":"Pot Roast","servings":6,"ingredients":["1.5 kg beef chuck","2 tbsp vegetable oil","2 onions","4 carrots","4 potatoes","4 clove garlic","2 tbsp tomato paste","1 cup red wine","3 cups beef stock","3 sprig thyme","2 bay leaf","2 tsp salt","1 tsp black pepper"],"steps":["Heat the oven to 160C. Dry the beef, salt it heavily, and sear it hard on every side in the oil. Take your time here.","Set the beef aside. Cook the onions and garlic in the same pot, add the tomato paste and fry 2 minutes.","Deglaze with the wine, scraping everything up, and reduce by half.","Return the beef with the stock, thyme and bay. Lid on, into the oven for 2.5 hours.","Add the chunked carrot and potato and cook 1 hour more, until the beef pulls apart with a fork.","Rest 20 minutes, then shred and serve in the braising liquid."],"notes":"Not quick. Worth clearing an afternoon for."},{"title":"Ratatouille","servings":4,"ingredients":["1 eggplant","2 zucchini","1 red capsicum","1 yellow capsicum","4 tomatoes","1 onion","4 clove garlic","0.25 cup olive oil","1 tbsp tomato paste","2 sprig thyme","0.25 cup basil","1 tsp salt"],"steps":["Salt the diced eggplant and leave it 20 minutes, then pat dry.","Fry each vegetable separately in oil until browned, setting each aside as it is done. Cooking them together turns it to mush.","Soften the onion and garlic last, add the tomato paste and fry it off.","Return everything with the chopped tomatoes and thyme, season, and simmer gently 25 minutes.","Off the heat, stir the torn basil through and add a last splash of olive oil."],"notes":"Better the next day, cold or warm."},{"title":"Red Lobster Biscuits","servings":6,"ingredients":["2 cups self raising flour","1 tbsp sugar","1 tsp garlic powder","0.5 tsp salt","1.5 cups grated cheddar","1 cup buttermilk","60 g butter, melted","60 g butter for brushing","1 tsp dried parsley"],"steps":["Heat the oven to 220C. Mix the flour, sugar, garlic powder and salt, then the cheese.","Stir in the buttermilk and the first lot of melted butter until just combined. Stop as soon as it comes together — overmixing makes them tough.","Drop rough spoonfuls onto a lined tray, keeping them craggy.","Bake 12 to 14 minutes until golden.","Melt the second lot of butter with the parsley and extra garlic powder, and brush it over while they are still hot."]},{"title":"Slow Cook Brisket","servings":8,"ingredients":["2 kg beef brisket","2 tbsp brown sugar","1 tbsp paprika","1 tbsp salt","2 tsp garlic powder","2 tsp onion powder","1 tsp black pepper","1 tsp cayenne pepper","1 cup beef stock","0.5 cup barbecue sauce","2 tbsp apple cider vinegar"],"steps":["Mix the sugar, spices, salt and pepper and rub it over the whole brisket. Leave it overnight in the fridge if you can.","Sear it on all sides in a hot dry pan, fat cap first.","Put it fat-side up in the slow cooker with the stock and vinegar poured around, not over, the rub.","Low for 9 hours. Do not lift the lid to check.","Rest it 30 minutes before slicing against the grain. Reduce the cooking liquid with the barbecue sauce and spoon over."],"notes":"Nine hours, so start it in the morning."},{"title":"Slow Cook Southwest Chicken","servings":4,"ingredients":["700 g chicken thigh","1 can black beans, drained","1 cup frozen corn","1 can crushed tomatoes","1 onion","3 clove garlic","1 tbsp cumin","1 tbsp paprika","1 tsp chilli powder","1 tsp oregano","1 tsp salt","1 lime","0.5 cup coriander","0.5 cup sour cream"],"steps":["Put the chicken in the slow cooker with the onion, garlic, tomatoes, beans, corn and all the spices. Stir to coat.","Low for 6 hours, or high for 3.","Shred the chicken with two forks straight in the pot and stir it back through the sauce.","Lime juice and coriander at the end, sour cream on top. Good in wraps or over rice."]},{"title":"Spaghetti Carbonara","servings":2,"ingredients":["200 g spaghetti","120 g guanciale or pancetta","2 eggs","1 egg yolk","60 g grated pecorino","1 tsp black pepper","0.5 tsp salt"],"steps":["Boil the spaghetti in well salted water. No cream goes anywhere near this.","Render the diced pancetta in a cold dry pan over medium heat until crisp, keeping the fat.","Whisk the eggs, extra yolk, pecorino and a lot of black pepper into a paste.","Drain the pasta and tip it into the pan with the pancetta, off the heat, tossing to coat in the fat.","Wait 30 seconds, then add the egg mixture and toss hard, loosening with pasta water until it turns glossy. Too hot and you get scrambled egg."],"notes":"The pan being off the heat is the entire technique."},{"title":"Spinach and Artichoke Dip in Bread Bowl","servings":6,"ingredients":["1 cob loaf","250 g cream cheese","0.5 cup sour cream","0.5 cup mayonnaise","250 g frozen spinach, thawed","1 can artichoke hearts, drained","1.5 cups grated mozzarella","0.5 cup grated parmesan","3 clove garlic","0.5 tsp black pepper"],"steps":["Heat the oven to 190C. Squeeze the spinach absolutely dry in a tea towel — this is the one step people skip and then wonder why it is watery.","Cut the top off the loaf and hollow it out, tearing the removed bread into dipping chunks.","Mix the cream cheese, sour cream, mayo, garlic, chopped artichokes, spinach and most of the cheese.","Fill the loaf, top with the rest of the cheese, and bake 30 minutes until bubbling.","Toast the bread chunks alongside for the last 10 minutes."]},{"title":"Swedish Meatballs","servings":4,"ingredients":["500 g beef mince","250 g pork mince","1 onion","0.5 cup panko breadcrumbs","0.25 cup milk","1 egg","0.5 tsp allspice","0.25 tsp nutmeg","40 g butter","0.33 cup plain flour","3 cups beef stock","0.5 cup thickened cream","1 tbsp soy sauce","1 tsp dijon mustard","1 tsp salt"],"steps":["Soak the panko in the milk. Grate the onion in and mix with both minces, the egg, allspice, nutmeg and salt.","Roll into small balls, about 24, and chill 20 minutes.","Brown them in batches in half the butter — do not crowd the pan. Set aside.","Melt the rest of the butter, whisk in the flour and cook 2 minutes, then add the stock slowly until smooth.","Stir in the cream, soy and mustard, return the meatballs, and simmer 10 minutes until cooked through."],"notes":"Allspice and nutmeg are what make them Swedish rather than just meatballs."}];

 for the dipping sauce."]},{"title":"Blue Cheese Sauce","servings":4,"ingredients":["120 g blue cheese","0.5 cup thickened cream","0.25 cup sour cream","2 tbsp mayonnaise","1 tbsp lemon juice","1 clove garlic","0.5 tsp black pepper","1 tbsp chopped chives"],"steps":["Crumble two thirds of the blue cheese into a small pot with the cream and warm gently until melted.","Take it off the heat and stir in the sour cream, mayo, lemon and crushed garlic.","Fold the remaining cheese through so there are still lumps in it.","Season with pepper and chives. Thin with a splash of cream if it sets too thick."],"notes":"Good hot on steak, cold as a wing dip."},{"title":"Braised Beef Short Ribs","servings":4,"ingredients":["1.5 kg beef short ribs","2 tbsp vegetable oil","1 onion","2 carrots","2 celery sticks","4 clove garlic","2 tbsp tomato paste","2 cups red wine","3 cups beef stock","3 sprig thyme","2 bay leaf","2 tsp salt","1 tsp black pepper"],"steps":["Heat the oven to 160C. Dry the ribs, season heavily, and sear all sides in the oil until properly dark. This crust is your flavour.","Set aside. Cook the diced onion, carrot and celery 8 minutes, add the garlic and tomato paste and fry 2 minutes.","Deglaze with the wine and reduce by half, scraping the pan.","Return the ribs with the stock, thyme and bay. The liquid should come most of the way up, not cover them.","Lid on, 3 hours, until the meat retreats from the bone.","Lift the ribs out, skim the fat, and reduce the sauce hard until it coats a spoon."],"notes":"Better made a day ahead — chill it, lift the fat off, reheat."},{"title":"Butter Chicken","servings":4,"ingredients":["800 g chicken thigh","0.5 cup Greek yoghurt","2 tbsp lemon juice","2 tbsp grated ginger","6 clove garlic","2 tsp garam masala","1 tsp turmeric","1 tsp cumin","1 tsp paprika","60 g butter","1 onion","2 can crushed tomatoes","1 cup thickened cream","1 tsp chilli powder","1 tsp sugar","2 tsp salt","0.25 cup coriander"],"steps":["Marinate the diced chicken in the yoghurt, lemon, half the ginger and garlic, and half the spices. An hour minimum, overnight is better.","Sear the chicken in batches in a hot dry pan until charred at the edges but not cooked through. Set aside.","Melt the butter, cook the diced onion 10 minutes, add the rest of the ginger, garlic and spices for 2 minutes.","Add the tomatoes, sugar and salt, simmer 20 minutes until deep red and thick, then blend smooth.","Return the chicken and simmer 10 minutes, then stir the cream through off the boil.","Coriander on top. Rice and naan."],"notes":"The char on the chicken is what makes it taste like the restaurant version."},{"title":"Chicken Adobo","servings":4,"ingredients":["1 kg chicken thigh and drumstick","0.5 cup soy sauce","0.5 cup white vinegar","8 clove garlic","3 bay leaf","1 tbsp whole peppercorns","1 tbsp brown sugar","1 cup water","2 tbsp vegetable oil","1 onion"],"steps":["Marinate the chicken in the soy, half the garlic and the peppercorns for at least an hour.","Lift the chicken out and brown it in the oil, skin-side first. Keep the marinade.","Add the onion and remaining garlic for 3 minutes.","Pour in the marinade, vinegar, water, bay and sugar. Now leave it alone without stirring for 5 minutes so the vinegar cooks off its sharpness.","Simmer uncovered 35 minutes, turning the chicken a few times, until the sauce is glossy and reduced by half.","Serve over rice with the sauce spooned over."],"notes":"Do not stir in the first five minutes after the vinegar goes in."},{"title":"Chicken Ala King","servings":4,"ingredients":["600 g chicken breast","60 g butter","0.33 cup plain flour","2 cups chicken stock","1 cup milk","200 g mushrooms","1 red capsicum","0.5 cup frozen peas","0.25 cup dry sherry","1 egg yolk","0.25 cup thickened cream","1 tsp salt","0.5 tsp white pepper","4 slice toast"],"steps":["Poach the chicken in the stock for 15 minutes, then shred it. Keep the stock.","Melt the butter, cook the sliced mushrooms and capsicum 6 minutes, then stir in the flour and cook 2 minutes.","Add the reserved stock and the milk slowly, whisking, until thick and smooth.","Add the chicken, peas and sherry, simmer 5 minutes.","Whisk the yolk into the cream, then stir it in off the heat — off the heat or it will curdle.","Season and spoon over toast."]},{"title":"Chicken Cutlet Caesar Salad","servings":2,"ingredients":["2 chicken breasts","1 cup plain flour","2 eggs","1.5 cups panko breadcrumbs","1 cup vegetable oil","2 baby cos lettuce","0.5 cup grated parmesan","1 cup bread cubes","4 anchovy fillets","1 egg yolk","1 clove garlic","1 tbsp dijon mustard","1 tbsp lemon juice","0.33 cup olive oil","1 tsp salt"],"steps":["Butterfly and flatten the breasts to 1cm. Flour, egg, panko, pressing the crumb on firmly.","Fry in 1cm of oil, 3 to 4 minutes a side, until deep golden. Drain on a rack and salt immediately.","Fry the bread cubes in the leftover oil until crisp.","For the dressing, mash the anchovies and garlic to a paste, whisk in the yolk, mustard and lemon, then dribble the olive oil in slowly until thick.","Toss the torn cos with the dressing and half the parmesan.","Slice the cutlets, lay them over the salad with the croutons and the rest of the parmesan."]},{"title":"Chicken Pot Pie","servings":4,"ingredients":["600 g chicken thigh","2 sheets puff pastry","60 g butter","1 onion","2 carrots","2 celery sticks","0.33 cup plain flour","2.5 cups chicken stock","0.5 cup thickened cream","1 cup frozen peas","2 tsp dried thyme","1 egg","1 tsp salt","0.5 tsp black pepper"],"steps":["Brown the diced chicken in half the butter and set aside.","Cook the diced onion, carrot and celery in the rest of the butter for 8 minutes, then stir in the flour and thyme and cook 2 minutes.","Add the stock gradually, whisking, until thick. Stir in the cream, chicken and peas, and season well.","Cool the filling before it goes near the pastry — hot filling makes a soggy lid.","Fill a dish, lay pastry over, press the edges down, cut a steam hole, brush with beaten egg.","Bake at 200C for 30 minutes until puffed and deep golden."]},{"title":"Chicken Risotto","servings":4,"ingredients":["1.5 cups arborio rice","500 g chicken thigh","5 cups chicken stock","1 onion","3 clove garlic","0.5 cup dry white wine","60 g butter","2 tbsp olive oil","0.75 cup grated parmesan","200 g mushrooms","1 tsp salt","0.5 tsp black pepper","2 tbsp parsley"],"steps":["Keep the stock at a bare simmer in a separate pot. Cold stock stalls the rice.","Brown the diced chicken in the oil, set aside. Cook the mushrooms, set aside.","Soften the onion and garlic in half the butter, add the rice and stir 2 minutes until the grains look glassy.","Add the wine and let it absorb, then add stock one ladle at a time, stirring, waiting for each to absorb before the next. About 18 minutes.","Return the chicken and mushrooms for the last 5 minutes.","Off the heat, beat in the rest of the butter and the parmesan. Rest 2 minutes before serving."]},{"title":"Creamy Lemon Chicken","servings":4,"ingredients":["4 chicken breasts","0.5 cup plain flour","2 tbsp olive oil","40 g butter","3 clove garlic","1 cup chicken stock","0.75 cup thickened cream","3 tbsp lemon juice","1 tsp lemon zest","0.5 cup grated parmesan","1 tsp salt","0.5 tsp black pepper","2 tbsp parsley"],"steps":["Butterfly the breasts, season and dust lightly with flour.","Sear in the oil 4 minutes a side until golden, then set aside.","Melt the butter in the pan, cook the garlic 30 seconds, add the stock and scrape everything up. Reduce by half.","Add the cream, lemon juice and zest, simmer 3 minutes, then stir in the parmesan.","Return the chicken to finish in the sauce for 5 minutes. Parsley over."],"notes":"Zest as well as juice, or it just tastes sour rather than lemony."},{"title":"Creamy Shrimp Scampi Linguine","servings":2,"ingredients":["400 g prawns","250 g linguine","60 g butter","2 tbsp olive oil","5 clove garlic","0.5 tsp chilli flakes","0.5 cup dry white wine","0.75 cup thickened cream","0.5 cup grated parmesan","2 tbsp lemon juice","0.25 cup parsley","1 tsp salt"],"steps":["Boil the linguine, saving a mug of the water.","Cook the prawns in the oil and half the butter, 90 seconds a side, then take them out so they do not overcook.","Cook the sliced garlic and chilli gently in the same pan, add the wine and reduce by half.","Add the cream and simmer 3 minutes, then the parmesan and lemon.","Return the prawns and the pasta, toss with a splash of pasta water until the sauce clings. Parsley and the last of the butter."]},{"title":"Crunchwrap Supreme","servings":4,"ingredients":["4 large tortillas","4 tostadas","500 g beef mince","1 packet taco seasoning","1 cup nacho cheese sauce","1 cup sour cream","2 cups shredded lettuce","1 tomato","1.5 cups grated cheddar","1 tbsp vegetable oil"],"steps":["Brown the mince with the taco seasoning and a splash of water until thick.","Lay a big tortilla down. Pile mince in the centre, spread cheese sauce over it, then sit a tostada on top.","Spread sour cream on the tostada, then lettuce, diced tomato and cheddar.","Fold the edges of the tortilla up over the middle in overlapping pleats, working around in a circle.","Cook seam-side down in a lightly oiled pan, 3 minutes, pressing with a spatula, then flip for 2 more."],"notes":"The tostada in the middle keeps the wet and dry fillings apart."},{"title":"Flautas","servings":4,"ingredients":["500 g cooked shredded chicken","12 corn tortillas","1 cup grated cheddar","1 onion","2 clove garlic","1 tsp cumin","1 tsp chilli powder","0.5 cup salsa","2 cups vegetable oil","0.5 cup sour cream","1 avocado","0.25 cup coriander"],"steps":["Cook the diced onion and garlic with the cumin and chilli powder, then stir through the chicken and salsa. Cool slightly.","Warm the tortillas so they roll without cracking — 20 seconds in a dry pan each.","Put a line of filling and cheese along one edge and roll tight. Secure with a toothpick.","Shallow fry seam-side down in 2cm of oil, turning, 3 minutes total until crisp and golden.","Drain, pull the toothpicks, and serve with sour cream, sliced avocado and coriander."],"notes":"Swap the chicken for black beans and it still works."},{"title":"Halal Chicken and Rice","servings":4,"ingredients":["800 g chicken thigh","2 tbsp olive oil","1 tbsp oregano","1 tbsp lemon juice","1.5 cups basmati rice","40 g butter","0.5 tsp turmeric","0.5 tsp cumin","3 cups chicken stock","1 cup mayonnaise","0.25 cup Greek yoghurt","1 tbsp sugar","1 tbsp white vinegar","1 tsp salt","1 iceberg lettuce","1 tomato"],"steps":["Marinate the chicken in the oil, oregano, lemon and salt for an hour.","Melt the butter in a pot, add the rinsed rice with the turmeric and cumin and toast 2 minutes.","Add the stock, bring to a boil, cover and cook 15 minutes, then rest 10 off the heat.","Meanwhile cook the chicken in a very hot pan until charred, then chop it roughly on the board.","For the white sauce, whisk the mayo, yoghurt, sugar, vinegar and a pinch of salt.","Rice, chopped chicken, shredded lettuce and tomato, then far too much white sauce."]},{"title":"Honey Mustard Sauce","servings":4,"ingredients":["0.33 cup mayonnaise","3 tbsp dijon mustard","3 tbsp honey","1 tbsp white vinegar","1 tsp lemon juice","0.25 tsp paprika","0.25 tsp salt"],"steps":["Whisk everything together until completely smooth.","Rest it 20 minutes in the fridge so the mustard mellows.","Taste and balance — more honey if it bites, more vinegar if it is cloying."],"notes":"Keeps a fortnight in the fridge."},{"title":"Key Lime Pie","servings":8,"ingredients":["250 g digestive biscuits","120 g butter, melted","2 tbsp caster sugar","4 egg yolks","400 g condensed milk","0.75 cup lime juice","2 tsp lime zest","300 ml thickened cream","2 tbsp icing sugar"],"steps":["Heat the oven to 160C. Blitz the biscuits to crumbs, mix with the melted butter and sugar, press firmly into a tin. Bake 10 minutes and cool.","Whisk the yolks with the zest for 2 minutes until pale, then whisk in the condensed milk.","Add the lime juice and whisk just until combined — it thickens on contact.","Pour into the shell and bake 15 minutes, until set with a slight wobble.","Cool completely, then refrigerate at least 4 hours.","Whip the cream with the icing sugar and pile it on before serving."]},{"title":"KFC Chicken and Mash Bowl","servings":4,"ingredients":["800 g chicken thigh","2 cups buttermilk","2 cups plain flour","1 tbsp paprika","2 tsp garlic powder","2 tsp onion powder","1 tsp white pepper","1 tsp dried thyme","1 tsp oregano","2 tsp salt","4 cups vegetable oil","1 kg potatoes","100 g butter","0.5 cup milk","2 cups chicken gravy","1 cup frozen corn","1.5 cups grated cheddar"],"steps":["Soak the diced chicken in the buttermilk for at least 2 hours.","Mix the flour with all the herbs and spices and the salt.","Lift the chicken straight from the buttermilk into the flour and press hard so it goes shaggy. Those shaggy bits are the crunch.","Fry at 170C for 6 to 7 minutes until deep golden. Drain on a rack.","Boil the potatoes, mash with the butter and warm milk, and season well.","Layer mash, corn, chicken, gravy over everything, then cheese on top while it is hot."]},{"title":"Lasagna","servings":6,"ingredients":["12 lasagne sheets","500 g beef mince","250 g pork mince","1 onion","2 carrots","4 clove garlic","3 tbsp tomato paste","2 can crushed tomatoes","1 cup red wine","1 cup milk","80 g butter","0.66 cup plain flour","4 cups milk for the sauce","0.25 tsp nutmeg","2 cups grated mozzarella","1 cup grated parmesan","2 tsp salt","1 tsp black pepper"],"steps":["Brown both minces hard, then add the finely diced onion, carrot and garlic for 10 minutes.","Add the tomato paste, fry 2 minutes, then the wine and reduce. Add the tomatoes and the first cup of milk.","Simmer the ragu at least 2 hours, uncovered, stirring now and then. This is not a step you can shorten.","For the bechamel, melt the butter, whisk in the flour, cook 2 minutes, then add the 4 cups of milk slowly until thick. Season with nutmeg and salt.","Layer: ragu, pasta, bechamel, a little cheese, and repeat, finishing with bechamel and all the remaining cheese.","Bake at 180C for 45 minutes, then rest 20 minutes before cutting or it collapses."],"notes":"Rest it. Twenty minutes minimum."},{"title":"Lumpia","servings":6,"ingredients":["500 g pork mince","30 spring roll wrappers","2 carrots","0.25 cabbage","1 onion","4 clove garlic","2 spring onion","2 tbsp soy sauce","1 tsp sesame oil","1 tsp black pepper","1 egg","4 cups vegetable oil","0.5 cup white vinegar","2 clove garlic for dipping","1 tsp sugar"],"steps":["Cook the pork with the garlic and onion until browned, then add the finely grated carrot and shredded cabbage for 5 minutes.","Season with soy, sesame oil and pepper, then drain the filling in a sieve and cool it completely. Wet filling tears the wrappers and spits in the oil.","Lay a wrapper as a diamond, put a thin line of filling near the bottom corner, fold the corner over, fold the sides in, roll tight and seal the tip with beaten egg.","Fry at 170C for 3 to 4 minutes, turning, until golden and blistered. Drain standing up.","For the dip, mix the vinegar with crushed garlic, sugar and a pinch of salt."],"notes":"Roll a big batch and freeze them raw, then fry from frozen."},{"title":"Mango Habanero Sauce","servings":4,"ingredients":["2 mangoes","4 habanero chillies","1 onion","4 clove garlic","0.5 cup white vinegar","0.25 cup honey","1 tbsp lime juice","1 tsp salt","0.5 cup water"],"steps":["Wear gloves for the habaneros and do not touch your face. Stem them, and take the seeds out for less heat.","Soften the diced onion and garlic in a little oil for 5 minutes.","Add the mango flesh, habaneros, vinegar, honey, salt and water. Simmer 15 minutes.","Blend completely smooth, then pass through a sieve if you want it silky.","Add the lime juice at the end, off the heat."],"notes":"Starts sweet, arrives late, stays a while. Keeps a month in the fridge."},{"title":"Otai","servings":6,"ingredients":["1 watermelon","2 mangoes","1 can coconut milk","1 cup milk","0.33 cup caster sugar","1 lime","1 cup crushed ice"],"steps":["Cut the watermelon in half and grate the flesh against a coarse grater, or squeeze it through your hands into a bowl. Texture is the point, so do not blend it.","Do the same with the mango flesh.","Stir in the coconut milk, milk and sugar until the sugar dissolves.","Add lime juice to taste and chill at least 2 hours.","Serve very cold over crushed ice."],"notes":"Grated, never blended."},{"title":"Oyster Chilli, Ginger & Vinegar Sauce","servings":4,"ingredients":["0.33 cup rice vinegar","1 tbsp grated ginger","1 long red chilli","1 shallot","1 tsp sugar","1 tsp soy sauce","1 tbsp lime juice","12 oysters"],"steps":["Finely dice the shallot and chilli and grate the ginger — everything needs to be tiny so it sits on the oyster rather than sliding off.","Stir into the vinegar with the sugar until dissolved.","Add the soy and lime, then rest it 30 minutes so the shallot softens.","Spoon half a teaspoon over each oyster right before eating."],"notes":"Make it ahead, dress at the last second."},{"title":"Pizza Bagels","servings":4,"ingredients":["4 bagels","1 cup passata","2 cups grated mozzarella","1 tsp dried oregano","1 tsp garlic powder","100 g pepperoni","2 tbsp olive oil","0.25 cup basil"],"steps":["Heat the oven to 200C. Split the bagels and toast the cut sides dry for 4 minutes first, so they do not go soggy.","Mix the passata with the oregano, garlic powder and a pinch of salt.","Spread thinly, then cheese, then pepperoni.","Bake 10 minutes until the cheese is bubbling and the pepperoni cups up.","Olive oil and torn basil over the top."]},{"title":"Pork Sinigang","servings":4,"ingredients":["1 kg pork ribs","1 packet sinigang mix","2 tomatoes","1 onion","1 daikon radish","150 g green beans","1 bunch water spinach","2 long green chillies","8 cups water","2 tbsp fish sauce","1 eggplant"],"steps":["Simmer the pork with the onion and tomatoes in the water for 1 hour, skimming the foam off as it rises.","Add the sliced daikon and eggplant and cook 10 minutes.","Stir in the sinigang mix and the fish sauce, and taste — it should make you wince slightly.","Add the beans and chillies for 5 minutes.","Throw the water spinach in at the very end and take it off the heat as soon as it wilts."],"notes":"Sour is the whole dish. Use tamarind paste if you cannot get the mix."},{"title":"Seafood Boil","servings":6,"ingredients":["1 kg prawns","1 kg mussels","4 corn cobs","1 kg baby potatoes","400 g smoked sausage","3 tbsp seafood boil seasoning","1 head garlic","2 lemons","200 g butter","1 tbsp paprika","1 tsp cayenne pepper","1 tbsp brown sugar","0.25 cup parsley"],"steps":["Bring a very large pot of water to the boil with half the seasoning, a halved head of garlic and a squeezed lemon.","Potatoes first, 12 minutes. Then sausage and corn, 6 minutes. Then prawns and mussels, 3 minutes, until the shells open and the prawns curl.","Drain everything, keeping a cup of the liquid.","Melt the butter with the crushed remaining garlic, the rest of the seasoning, paprika, cayenne, sugar and a splash of the cooking liquid.","Tip the whole lot into a tray or onto lined table, pour the butter over, scatter parsley and lemon wedges."],"notes":"Order matters — seafood goes in last or it turns to rubber."},{"title":"Singaporean Chili Crab","servings":4,"ingredients":["2 mud crabs","4 tbsp vegetable oil","6 clove garlic","3 tbsp grated ginger","4 long red chillies","0.5 cup tomato sauce","3 tbsp sambal","2 tbsp soy sauce","1 tbsp sugar","1 cup chicken stock","1 egg","1 tbsp cornflour","2 tbsp water","4 spring onion","6 slice white bread"],"steps":["Clean the crabs and cut them into pieces, cracking the claws with the back of a knife so the sauce gets in.","Blend the garlic, ginger and chillies into a paste and fry it in the oil for 3 minutes until fragrant.","Add the tomato sauce, sambal, soy, sugar and stock, bring to a boil.","Add the crab, cover, and cook 8 to 10 minutes, turning the pieces through the sauce.","Slurry the cornflour with the water and stir in, then drizzle the beaten egg in while stirring so it sets in ribbons.","Spring onion over, and white bread on the side for the sauce. That is non negotiable."],"notes":"Messy. Put newspaper down."},{"title":"Steak and Mashed Potato","servings":2,"ingredients":["2 ribeye steaks","1 kg potatoes","120 g butter","0.5 cup milk","2 tbsp vegetable oil","4 clove garlic","3 sprig thyme","2 tsp salt","1 tsp black pepper"],"steps":["Take the steaks out of the fridge 40 minutes early and salt them heavily. Room temperature meat cooks evenly.","Boil the peeled potatoes until a knife slides through, drain, and steam dry for 2 minutes.","Mash with 80g of the butter and the warm milk. Season hard — mash needs more salt than you think.","Get a heavy pan smoking hot with the oil. Cook the steaks 3 minutes without touching them, flip, 2 minutes more.","Add the rest of the butter, the crushed garlic and thyme, and spoon the foaming butter over for a minute.","Rest the steaks 5 minutes before cutting. Pour the pan butter over."],"notes":"Rest the meat. Every time."},{"title":"Strawberry Matcha Sago","servings":4,"ingredients":["0.5 cup small sago pearls","2 cups milk","1 tbsp matcha powder","2 tbsp hot water","0.33 cup caster sugar","250 g strawberries","1 cup coconut milk","1 tbsp honey"],"steps":["Boil the sago in plenty of water for 12 minutes, then turn the heat off and leave it covered 10 minutes until the pearls are clear with no white centre. Rinse under cold water.","Whisk the matcha with the hot water into a smooth paste, then stir into 1 cup of the milk with half the sugar.","Blend the strawberries with the rest of the sugar into a purée, keeping a few aside to slice.","Mix the coconut milk with the remaining milk and the honey.","Layer in glasses: strawberry purée, sago in coconut milk, then the matcha milk poured over. Chill before serving."],"notes":"Rinse the sago properly or it all glues together."}];
function applyPack4(){
  if(!state.packs) state.packs=[];
  if(state.packs.includes(PACK4_ID)) return 0;
  let n=0;
  PACK4.forEach(p=>{
    const key=norm(p.title);
    let r=state.recipes.find(x=>norm(x.title)===key);
    const ings=(p.ingredients||[]).map(l=>parseLine(l)).filter(Boolean);
    if(r){
      if(!r.ingredients.length) r.ingredients=ings;
      if(!r.steps.length) r.steps=p.steps||[];
      if(!r.servings||r.servings===2) r.servings=p.servings||r.servings;
      if(!r.notes&&p.notes) r.notes=p.notes;
      if(!r.kind) r.kind=guessKind(r);
      n++;
    } else {
      const rec={ id:uid(), title:p.title, photo:null, servings:p.servings||2, mult:1,
        queued:false, source:'', tags:[], ingredients:ings, steps:p.steps||[],
        notes:p.notes||'', madeLog:[] };
      rec.kind=guessKind(rec);
      state.recipes.push(rec); n++;
    }
  });
  state.packs.push(PACK4_ID);
  return n;
}

function adopt(next){
  state=Object.assign({ title:'Marquez Meals', checked:{}, extras:[], overrides:{}, packs:[],
    aisles:DEFAULT_AISLES.slice(), updated:null }, next);
  state.aisles=(state.aisles&&state.aisles.length)?state.aisles:DEFAULT_AISLES.slice();
  state.overrides=state.overrides||{};
  state.packs=state.packs||[];
  if(state.title==='Supper Club') state.title='Marquez Meals';
  state.recipes.forEach(r=>{ r.madeLog=r.madeLog||[]; r.tags=r.tags||[];
    r.ingredients=r.ingredients||[]; r.steps=r.steps||[];
    if(r.photo===undefined) r.photo=null;
    if(!r.kind) r.kind=guessKind(r); });
}

(async function(){
  const savedSync=await rawGet(SYNC_KEY);
  if(savedSync){ try{ sync=Object.assign(sync,JSON.parse(savedSync)); }catch(e){} }
  const saved=await rawGet(KEY);
  let data=null;
  if(saved){ try{ data=JSON.parse(saved); }catch(e){} }
  adopt(data&&Array.isArray(data.recipes)?data:seed());
  const added=applyPack();
  const filled=applyPack2()+applyPack3()+applyPack4();
  if(added||filled){ persist(); }
  render();
  if(added) toast(added+' recipes added from your old book');
  else if(filled) toast(filled+' recipes filled in');
  checkRemote();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkRemote(); });
})();
